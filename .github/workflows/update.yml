name: Update Prices

on:
  schedule:
    # 21:00 UTC (05:00 SGT) Mon-Fri — immediate snapshot after the US close.
    # Some European, HK and SG daily bars are still close=null at this point;
    # build.js substitutes regularMarketPrice as a provisional last bar so
    # the dashboard tracks the live chart price.
    - cron: '0 21 * * 1-5'
    # 04:00 UTC (12:00 SGT) Tue-Sat — finalisation pass ~7 hours later.
    # Picks up any lingering close=null bars that Yahoo has since finalised
    # and adds a mid-day Asian intraday read. Each run does a fresh full
    # Yahoo refetch, so the later build's history.json simply overwrites
    # the earlier one with finalised closes where now available.
    - cron: '0 4 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bake price data
        run: node build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-update prices $(date -u +%Y-%m-%d)"
          git push
