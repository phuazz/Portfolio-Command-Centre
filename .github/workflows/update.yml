name: Update Prices

on:
  schedule:
    # 10:00 UTC (18:00 SGT) Mon-Fri — one hour after SGX close. Captures SG
    # and HK end-of-day bars cleanly. Yahoo finalises SGX closes within
    # ~30 minutes of 17:00 SGT, so this run reliably picks up today's bar.
    - cron: '0 10 * * 1-5'
    # 21:00 UTC (05:00 SGT next day) Mon-Fri — immediate snapshot after the
    # US close. US bars finalise; SG/HK already finalised earlier today.
    - cron: '0 21 * * 1-5'
    # 04:00 UTC (12:00 SGT) Tue-Sat — mid-Asian finalisation pass for any
    # bars Yahoo finalised overnight. Each run is a fresh full refetch so
    # the later history.json overwrites the earlier with finalised closes.
    - cron: '0 4 * * 2-6'
  workflow_dispatch:

# contents:write  — the bake commits docs/ back to main (unchanged).
# pages:write + id-token:write — required by actions/deploy-pages to publish
# the built docs/ as a Pages artifact. This replaces the legacy branch-based
# Pages builder, which failed intermittently and then continuously from
# 2026-07-09. Root cause was a GitHub-side legacy-builder degradation, not
# repo size: failed builds reported 0 ms duration and the same commit both
# built and errored on different retries.
permissions:
  contents: write
  pages: write
  id-token: write

# Serialise Pages deploys so overlapping scheduled runs do not race. Do not
# cancel an in-flight deploy — let it finish rather than leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v5 of both actions run on Node 24. GitHub forces Node 24 for action
      # runtimes from 16 June 2026 and removes Node 20 from runners on
      # 16 September 2026, so the previous @v4 pins would break the daily bake.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Bake price data
        run: node build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-update prices $(date -u +%Y-%m-%d)"
          git push

      # Package the freshly-baked docs/ (the working tree, so it carries the
      # just-built data files) as the Pages artifact for the deploy job.
      - name: Upload Pages artifact
        # Review before 16 Sep 2026: confirm this major runs on Node 24, per
        # the runner note above.
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
