            const ltvCol = p.availLTV>=70?'var(--a)':p.availLTV>=60?'var(--c)':'var(--g)';
            return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)">
              <span style="font-size:11px;font-weight:600;width:65px">${p.ticker}</span>
              <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${p.availLTV}%;background:${ltvCol}"></div></div>
              <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:${ltvCol};width:35px;text-align:right">${p.availLTV}%</span>
              <span style="font-family:var(--mono);font-size:10px;color:var(--t3);width:70px;text-align:right">${fmtSGD(avail)}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title"><span class="indicator" style="background:var(--p)"></span>Single-Name Risk</div></div>
        <div class="card-body">
          <div style="margin-bottom:12px">
            <span style="font-size:22px;font-weight:700;color:var(--r)">${fmt(snW,1)}%</span>
            <span style="font-size:11px;color:var(--t3);margin-left:8px">single-stock exposure (${singleNames.length} names)</span>
          </div>
          ${singleNames.sort((a,b)=>b.weight-a.weight).map(p=>`
            <div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd)">
              <span style="font-size:11px;font-weight:600;width:65px">${p.ticker}</span>
              <span style="font-size:10px;color:var(--t3);flex:1">${p.name}</span>
              <span style="font-family:var(--mono);font-size:11px;width:40px;text-align:right">${fmt(p.weight,1)}%</span>
              <span class="pl ${p.pnlPct>=0?'pos':'neg'}" style="font-family:var(--mono);font-size:10px;width:55px;text-align:right">${fmtPct(p.pnlPct)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════
//  TAB: ATTRIBUTION ═══ (auto-inserted)
//  Contribution-to-return decomposition by theme across 1D / 1W / 1M
//  horizons. Mirrors the start-of-period weighting basis used by
//  calcPortfolioPeriodPnL so totals reconcile to the landing-page cards.
//    position contribution_i = (closeNow_i − closeThen_i) × qty_i × fx_i / Σ startSGD
//    theme contribution      = Σ_{i∈theme} contribution_i
//    portfolio return        = Σ theme contributions   (reconciliation gate)
// ═══════════════════════════════════════════════════════════════
const ATTR_HORIZONS = [
  { key:'1D',  label:'1 Day',   bars:1,    ytd:false },
  { key:'1W',  label:'1 Week',  bars:5,    ytd:false },
  { key:'1M',  label:'1 Month', bars:21,   ytd:false },
  { key:'YTD', label:'YTD',     bars:null, ytd:true  },
];

function calcAttribution(ps, bars) {
  // Total-return attribution. effectiveReturn() handles both the
  // adjclose-vs-raw choice (use adjclose, includes dividends) and the
  // snapshot-aware closeNow shift so 1D / 1W / 1M reflect today's move
  // even when the pipeline has not yet appended today's bar to history.
  const rows = [];
  let totalStart = 0;
  for (const p of ps) {
    const r = effectiveReturn(p, bars);
    if (!r) continue;
    // FX-as-of-date: closeThen converted at the historical FX rate; closeNow
    // converted at today's rate. Captures both equity and FX components of
    // return in the dollar number. Falls back to p.fxRate when FX_HISTORY
    // does not cover the lookback date.
    const fxThen    = fxAtDate(p.ccy, r.refDate);
    const fxNow     = p.fxRate || 1;
    const startSGD  = r.closeThen * p.qty * fxThen;
    const endSGD    = r.closeNow  * p.qty * fxNow;
    const dollar    = endSGD - startSGD;
    if (!isFinite(startSGD) || startSGD === 0) continue;
    rows.push({
      pos: p,
      startSGD, endSGD, dollar,
      retPct: ((r.closeNow - r.closeThen) / r.closeThen) * 100,
    });
    totalStart += startSGD;
  }
  rows.forEach(r => {
    r.weightPct = totalStart > 0 ? (r.startSGD / totalStart) * 100 : 0;
    r.contribPp = totalStart > 0 ? (r.dollar   / totalStart) * 100 : 0;
  });
  const themeMap = {};
  rows.forEach(r => {
    const t = r.pos.theme || '(Unclassified)';
    if (!themeMap[t]) themeMap[t] = { theme:t, startSGD:0, dollar:0, contribPp:0, weightPct:0, positions:[] };
    themeMap[t].startSGD  += r.startSGD;
    themeMap[t].dollar    += r.dollar;
    themeMap[t].contribPp += r.contribPp;
    themeMap[t].weightPct += r.weightPct;
    themeMap[t].positions.push(r);
  });
  const themes = Object.values(themeMap).map(t => ({
    ...t,
    retPct: t.startSGD > 0 ? (t.dollar / t.startSGD) * 100 : 0,
  }));
  const totalDollar = rows.reduce((s,r) => s + r.dollar, 0);
  return {
    bars,
    totalStart, totalDollar,
    portfolioRetPct: totalStart > 0 ? (totalDollar / totalStart) * 100 : 0,
    rows, themes,
    covered: rows.length,
    skipped: ps.length - rows.length,
  };
}

// ─── YTD ATTRIBUTION: TRADE-AWARE FIFO LOT ACCOUNTING ───────────────
// For each ticker present in POSITIONS:
//   1. Determine pre-YTD qty from current_qty minus net YTD trade flow.
//   2. Seed the lot queue with that pre-YTD qty at the Jan-1 close
//      (looked up from p.history; first 2026 bar).
//   3. Walk YTD trades chronologically. Buy appends a new lot. Sell
//      consumes lots FIFO and accrues realised P&L vs each lot's cost.
//   4. Mark the remaining lots to current price for unrealised P&L.
//   5. Total YTD P&L per ticker = realised + unrealised (in SGD).
// Tickers with sells but no current position and no buys in YTD have
// pre-YTD inventory of unknown cost — for those we fall back to the
// sell price as cost basis (realised = 0) and flag the position so the
// UI can footnote it. Round-trip closed positions (buy then sell within
// YTD with no current holding) compute correctly without any pre-YTD lot.
function calcYtdAttribution(ps, trades) {
  const fmtDateKey = s => s;                            // already YYYY-MM-DD ISO
  const posByTicker = {};
  ps.forEach(p => { posByTicker[p.ticker] = p; });

  // Sort trades chronologically (stable: same-day trades follow input order).
  const sorted = [...trades].sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);

  // Group sorted trades by ticker.
  const byTicker = {};
  for (const tr of sorted) {
    if (!byTicker[tr.t]) byTicker[tr.t] = [];
    byTicker[tr.t].push(tr);
  }

  // First 2026 bar (Jan 1 close) from any position's history — cached by yf.
  const jan1Cache = {};
  const getJan1Px = (pos) => {
    if (!pos || !pos.history) return null;
    const yf = pos.yf;
    if (jan1Cache[yf] !== undefined) return jan1Cache[yf];
    const h = pos.history;
    for (let i = 0; i < h.length; i++) {
      const d = h[i].date instanceof Date ? h[i].date : new Date(h[i].date);
      if (d.getFullYear() === 2026) { jan1Cache[yf] = h[i].close; return h[i].close; }
    }
    return (jan1Cache[yf] = null);
  };

  // Dividend uplift factor u(d) = close(d) / adjclose(d) for the history bar on
  // or before isoDate. Yahoo normalises adjclose to equal close at the most
  // recent bar, so u >= 1 and rises the further back you look — it encodes the
  // cumulative dividend stream from date d forward. Total-return value over a
  // hold from entry e to exit x equals the price-return value times u(e)/u(x);
  // at today u = 1, so a still-held lot's total mark is simply price * u(entry).
  // Returns 1 when history or adjclose is missing, degrading to price return.
  const uFactorAt = (pos, isoDate) => {
    if (!pos || !pos.history || pos.history.length === 0) return 1;
    let chosen = null;
    for (const bar of pos.history) {
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      if (ds <= isoDate) chosen = bar; else break;   // history is ascending
    }
    if (!chosen) chosen = pos.history[0];
    const c = chosen.close, a = chosen.adjclose;
    return (c != null && a != null && a !== 0) ? c / a : 1;
  };

  // u at the seeded pre-YTD lot's basis bar (the first 2026 bar — the same bar
  // getJan1Px reads its raw close from), so the Jan-1 lot's dividends are
  // captured on a basis consistent with its cost.
  const getJan1U = (pos) => {
    if (!pos || !pos.history) return 1;
    for (const bar of pos.history) {
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      if (d.getFullYear() === 2026) {
        const c = bar.close, a = bar.adjclose;
        return (c != null && a != null && a !== 0) ? c / a : 1;
      }
    }
    return 1;
  };

  const rows = [];
  const flags = [];
  let totalStart = 0;

  // Tickers to process = union(POSITIONS tickers, trade tickers)
  const tickerSet = new Set([...ps.map(p => p.ticker), ...Object.keys(byTicker)]);

  for (const ticker of tickerSet) {
    const pos = posByTicker[ticker] || null;
    const trades = byTicker[ticker] || [];
    if (trades.length === 0 && pos && (!pos.history || pos.history.length < 50)) continue;

    // Net YTD flow
    let buyQty = 0, sellQty = 0;
    let buyCost = 0;        // sum of buy proceeds in native ccy (for cash-flow reporting)
    let sellProceeds = 0;
    for (const tr of trades) {
      if (tr.a === 'B') { buyQty  += tr.q; buyCost += tr.q * tr.p; }
      else              { sellQty += tr.q; sellProceeds += tr.q * tr.p; }
    }

    // Pre-YTD qty = current qty + sells - buys (positions held into year)
    const currentQty = pos ? pos.qty : 0;
    const jan1Qty = currentQty - buyQty + sellQty;

    // Resolve Jan-1 close: from pos.history if pos has it; else null (flag).
    let jan1Px = pos ? getJan1Px(pos) : null;

    // Build initial lot queue
    const lots = [];
    if (jan1Qty > 0) {
      if (jan1Px == null) {
        // Closed-out positions with no current POSITIONS entry: try the
        // PRE_YTD_BASIS lookup (Dec 31 2025 close from earlier-bake history)
        // before falling back to sell-price-as-cost.
        if (PRE_YTD_BASIS[ticker] != null) {
          jan1Px = PRE_YTD_BASIS[ticker];
        } else {
          const firstSell = trades.find(tr => tr.a === 'S');
          const firstBuy  = trades.find(tr => tr.a === 'B');
          jan1Px = firstSell ? firstSell.p : (firstBuy ? firstBuy.p : 0);
          flags.push({ ticker, reason: 'pre-YTD lot — cost basis unavailable, sell price used' });
        }
      }
      lots.push({ qty: jan1Qty, cost: jan1Px, u: getJan1U(pos) });
    }

    // Replay trades FIFO
    let realised = 0;
    for (const tr of trades) {
      if (tr.a === 'B') {
        lots.push({ qty: tr.q, cost: tr.p, u: uFactorAt(pos, tr.d) });
      } else {
        const uSell = uFactorAt(pos, tr.d);
        let remaining = tr.q;
        while (remaining > 0 && lots.length > 0) {
          const lot = lots[0];
          const take = Math.min(lot.qty, remaining);
          // Total-return realised: sale proceeds dividend-uplifted from the
          // lot's entry date to the sale date (u_entry / u_sell), less the raw
          // cash cost of the lot.
          realised += (tr.p * ((lot.u || 1) / uSell) - lot.cost) * take;
          lot.qty -= take;
          remaining -= take;
          if (lot.qty <= 1e-9) lots.shift();
        }
        if (remaining > 0) flags.push({ ticker, reason: `sell of ${tr.q} on ${tr.d} exceeded available lots (${remaining} unmatched)` });
      }
    }

    // Mark remaining lots to current price (unrealised)
    let unrealised = 0;
    let endQty = 0;
    const currentPx = pos ? pos.mktPrice : (lots.length && trades.length ? trades[trades.length-1].p : 0);
    for (const lot of lots) {
      // Total-return unrealised: current price dividend-uplifted from the lot's
      // entry date to today (u_today = 1), less the raw cash cost.
      unrealised += (currentPx * (lot.u || 1) - lot.cost) * lot.qty;
      endQty += lot.qty;
    }

    // Validate replay-implied end qty against POSITIONS
    if (pos && Math.abs(endQty - pos.qty) > 0.01) {
      flags.push({ ticker, reason: `FIFO end qty ${endQty.toFixed(0)} vs POSITIONS qty ${pos.qty} — trade ledger may be incomplete` });
    }

    // Convert to SGD using current FX (approximation — ignores intra-year FX)
    const fxRate = pos ? pos.fxRate : (FX[trades[0]?.ccy] || 1);
    const realisedSGD   = realised   * fxRate;
    const unrealisedSGD = unrealised * fxRate;
    const dollar        = realisedSGD + unrealisedSGD;
    const startSGD      = jan1Qty > 0 ? jan1Qty * (jan1Px || 0) * fxRate : 0;
    // Effective basis = max(start NAV, cost of capital deployed during YTD).
    // For themes built entirely during the year, startSGD is 0 — using the
    // sum of YTD buy costs as denominator gives a meaningful return number
    // instead of 0.00%.
    const buyCostNative = trades.filter(t => t.a === 'B').reduce((s, t) => s + t.q * t.p, 0);
    const buyCostSGD    = buyCostNative * fxRate;
    const basisSGD      = Math.max(startSGD, buyCostSGD);

    // Theme from POSITIONS if available, else from first trade entry
    const theme = pos ? pos.theme : (trades[0]?.th || '(Unclassified)');

    rows.push({
      pos: pos || { ticker, name: trades[0]?.t || ticker, theme, account: 'Brokerage', ccy: trades[0]?.ccy || 'SGD', qty: 0 },
      isClosed: !pos,
      theme,
      jan1Qty, jan1Px, currentPx, endQty,
      buyQty, sellQty, buyCostSGD,
      realisedSGD, unrealisedSGD, dollar,
      startSGD, basisSGD,
      // Null-out retPct when there is no realised+unrealised P&L recorded — this isolates
      // the data-quality fallback cases (closed positions with unknown pre-YTD basis)
      // from displaying a misleading +0.00%. fmtPct renders null as '—'.
      retPct: (dollar === 0) ? null : (basisSGD > 0 ? (dollar / basisSGD) * 100 : null),
    });
    totalStart += startSGD;
  }

  const totalDollar = rows.reduce((s, r) => s + r.dollar, 0);

  // Weights & contributions. Null-out contribPp when there is no recorded
  // P&L for this row so the renderer prints '—' rather than '+0.00%'
  // (matches the retPct null treatment — flags data-quality fallback rows).
  rows.forEach(r => {
    r.weightPct = totalStart > 0 ? (r.startSGD / totalStart) * 100 : 0;
    r.contribPp = (r.dollar === 0) ? null : (totalStart > 0 ? (r.dollar / totalStart) * 100 : null);
  });

  // Group by theme — same shape as calcAttribution
  const themeMap = {};
  rows.forEach(r => {
    const t = r.theme || '(Unclassified)';
    if (!themeMap[t]) themeMap[t] = { theme:t, startSGD:0, basisSGD:0, dollar:0, contribPp:0, weightPct:0, realisedSGD:0, unrealisedSGD:0, positions:[] };
    themeMap[t].startSGD     += r.startSGD;
    themeMap[t].basisSGD     += r.basisSGD || 0;
    themeMap[t].dollar       += r.dollar;
    themeMap[t].contribPp    += (r.contribPp || 0);   // null coerced to 0 for safe summation
    themeMap[t].weightPct    += r.weightPct;
    themeMap[t].realisedSGD  += r.realisedSGD;
    themeMap[t].unrealisedSGD+= r.unrealisedSGD;
    themeMap[t].positions.push(r);
  });
  const themes = Object.values(themeMap).map(t => ({
    ...t,
    retPct: (t.dollar === 0) ? null : (t.basisSGD > 0 ? (t.dollar / t.basisSGD) * 100 : null),
    contribPp: (t.dollar === 0) ? null : t.contribPp,
  }));

  return {
    bars: null, horizon: 'YTD',
    totalStart, totalDollar,
    portfolioRetPct: totalStart > 0 ? (totalDollar / totalStart) * 100 : 0,
    rows, themes,
    covered: rows.length,
    skipped: ps.length - rows.filter(r => !r.isClosed).length,
    flags,
  };
}


// ─── TWRR (Modified Dietz) ON THE EQUITY SUB-PORTFOLIO ──────────────
// For YTD: for each priced position, walks the trade ledger to reconstruct
// a daily qty trajectory, sums (qty × close × FX) per day to a daily equity
// NAV time-series, treats each trade day's net flow as an external cash
// flow into/out of the equity sub-portfolio, and geometrically links the
// sub-period returns. Bonds and cash are excluded — they have no meaningful
// equity-style daily return.
//
// Returns:
//   { equityTwrr, days, flowCount, flowTotalSGD, bmv, emv, error?, dates[] }
// Returns the date axis (ISO YYYY-MM-DD strings, sorted ascending) extended
// with today's date if any priced position has a snapshot price fresher than
// its last history bar — i.e. today's bar has not yet been baked into the
// pipeline output. Caller is responsible for populating closeMatrix at the
// appended date with each position's snapshot price (or carry-forward).
function _maybeAppendTodayDate(dates, priced) {
  if (!dates || dates.length === 0) return dates || [];
  const todayISO = new Date().toISOString().slice(0, 10);
  if (todayISO <= dates[dates.length - 1]) return dates;
  for (const p of priced) {
    if (!p.history || p.history.length === 0) continue;
    const lastBar = p.history[p.history.length - 1];
    const lastAdj = lastBar.adjclose != null ? lastBar.adjclose : lastBar.close;
    if (p.mktPrice != null && Math.abs(p.mktPrice - lastAdj) > 1e-6) {
      return [...dates, todayISO];
    }
  }
  return dates;
}

function calcTwrr(ps, trades, startDateStr) {
  // 1. Priced equity universe: any position with usable history.
  const priced = ps.filter(p => p.history && p.history.length >= 50 && p.type !== 'Bond' && p.type !== 'Cash');
  if (priced.length === 0) return { equityTwrr: 0, days: 0, flowCount: 0, flowTotalSGD: 0, bmv: 0, emv: 0, error: 'No priced equity positions' };

  // 2. Unified date axis = union of all bar dates >= startDate.
  const allDates = new Set();
  for (const p of priced) {
    for (const bar of p.history) {
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      if (ds >= startDateStr) allDates.add(ds);
    }
  }
  let dates = [...allDates].sort();
  // Extend dates with today's snapshot point when the pipeline has not yet
  // appended today's bar. This ensures the right-edge TWRR reading reflects
  // today's intraday move (closeMatrix below populates today from p.mktPrice).
  dates = _maybeAppendTodayDate(dates, priced);
  if (dates.length < 2) return { equityTwrr: 0, days: dates.length, flowCount: 0, flowTotalSGD: 0, bmv: 0, emv: 0, error: 'Not enough trading dates in window' };

  // 3. Index trades by ticker × date for the qty walk, and by date alone for cash-flow aggregation.
  const tradesByTickerDate = {};
  const tradesByDate = {};
  for (const t of trades) {
    if (!tradesByTickerDate[t.t]) tradesByTickerDate[t.t] = {};
    if (!tradesByTickerDate[t.t][t.d]) tradesByTickerDate[t.t][t.d] = [];
    tradesByTickerDate[t.t][t.d].push(t);
    if (!tradesByDate[t.d]) tradesByDate[t.d] = [];
    tradesByDate[t.d].push(t);
  }

  // 4. qty trajectory per ticker: start at jan1Qty, apply trades chronologically (post-trade snapshot per date).
  const qtyMatrix = {};
  for (const p of priced) {
    const all = trades.filter(t => t.t === p.ticker);
    const buyTotal  = all.filter(t => t.a === 'B').reduce((s, t) => s + t.q, 0);
    const sellTotal = all.filter(t => t.a === 'S').reduce((s, t) => s + t.q, 0);
    let qty = p.qty - buyTotal + sellTotal;     // jan-1 inferred qty
    qtyMatrix[p.ticker] = {};
    for (const ds of dates) {
      const tt = tradesByTickerDate[p.ticker]?.[ds] || [];
      for (const t of tt) qty += (t.a === 'B' ? t.q : -t.q);
      qtyMatrix[p.ticker][ds] = qty;
    }
  }

  // 5. close matrix per ticker × date with forward-fill, SEEDED from the last
  // close BEFORE the window. Without the seed, staggered market openings make
  // NAV ramp up over the first few days and Modified Dietz mis-reads it as
  // organic return.
  // Adjclose-based close matrix with seed-from-last-bar-before-window. Using
  // adjclose makes the TWRR a total-return number (dividends rolled in via
  // Yahoo's split- and dividend-adjusted series).
  const closeMatrix = {};
  const todayISO_twrr = new Date().toISOString().slice(0, 10);
  for (const p of priced) {
    closeMatrix[p.ticker] = {};
    let lastCloseBeforeWindow_twrr = null;
    for (let i = p.history.length - 1; i >= 0; i--) {
      const bar = p.history[i];
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      if (ds < startDateStr) { lastCloseBeforeWindow_twrr = bar.adjclose != null ? bar.adjclose : bar.close; break; }
    }
    for (const bar of p.history) {
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      closeMatrix[p.ticker][ds] = bar.adjclose != null ? bar.adjclose : bar.close;
    }
    // Snapshot-aware: populate today with the live snapshot price.
    if (dates.length > 0 && dates[dates.length - 1] === todayISO_twrr && p.mktPrice != null) {
      closeMatrix[p.ticker][todayISO_twrr] = p.mktPrice;
    }
    let last = lastCloseBeforeWindow_twrr;
    for (const ds of dates) {
      if (closeMatrix[p.ticker][ds] != null) last = closeMatrix[p.ticker][ds];
      else if (last != null) closeMatrix[p.ticker][ds] = last;
    }
  }

  // 6. Daily equity NAV + daily trade cash flow (SGD, sign-adjusted from equity-sub perspective).
  //    + flow = buy (cash INTO equity);  − flow = sell (cash OUT of equity into the cash bucket).
  // FX-as-of-date: NAV bars use FX as of the bar's date; trade CFs use FX
  // as of the trade date.
  const navByDate = {};
  const cfByDate = {};
  for (const ds of dates) {
    let nav = 0;
    for (const p of priced) {
      const qty = qtyMatrix[p.ticker][ds];
      const px  = closeMatrix[p.ticker][ds];
      if (qty > 0 && px != null) nav += qty * px * fxAtDate(p.ccy, ds);
    }
    navByDate[ds] = nav;

    let cf = 0;
    for (const t of (tradesByDate[ds] || [])) {
      const pos = ps.find(p => p.ticker === t.t);
      if (!pos || !pos.history || pos.history.length < 50 || pos.type === 'Bond' || pos.type === 'Cash') continue;
      const fx = fxAtDate(pos.ccy, t.d);
      const usd = t.q * t.p * fx;
      cf += (t.a === 'B' ? usd : -usd);
    }
    cfByDate[ds] = cf;
  }

  // 7. Geometric link of daily Modified-Dietz sub-period returns.
  //    Sub-period return = (EMV − CF) / BMV − 1
  //    (CF assumed at end of period — simplest Dietz; mid-period weighting is a 2nd-order refinement.)
  let cumRet = 1;
  let flowCount = 0, flowTotalSGD = 0;
  for (let i = 1; i < dates.length; i++) {
    const bmv = navByDate[dates[i - 1]];
    const emv = navByDate[dates[i]];
    const cf  = cfByDate[dates[i]];
    if (bmv <= 0) continue;
    const r = (emv - cf) / bmv - 1;
    if (isFinite(r)) cumRet *= (1 + r);
    if (cf !== 0) { flowCount++; flowTotalSGD += cf; }
  }

  return {
    equityTwrr: (cumRet - 1) * 100,
    days: dates.length,
    flowCount,
    flowTotalSGD,
    bmv: navByDate[dates[0]],
    emv: navByDate[dates[dates.length - 1]],
  };
}


// ─── EQUITY CURVE + DRAWDOWN ENGINE ─────────────────────────────────
// Reconstructs daily equity NAV from history.json closes + TRADES_YTD
// quantity walk. Returns the full time series ready for charting plus
// rich KPIs (max drawdown, best/worst day).
//
// Returns: { dates, nav, cf, dailyReturn, cumReturn, drawdown,
//            startNav, currentNav, totalReturnPct, maxDrawdown:{value,date,from},
//            bestDay:{date,return}, worstDay:{date,return} }
function getEquityCurve(ps, trades, startDateStr) {
  const priced = ps.filter(p => p.history && p.history.length >= 50 && p.type !== 'Bond' && p.type !== 'Cash');
  if (priced.length === 0) return { dates: [], nav: [], error: 'No priced positions' };

  // Build unified date axis from window-start onward, then extend with
  // today's snapshot point if the pipeline has not yet baked today's bar.
  const allDates = new Set();
  for (const p of priced) {
    for (const bar of p.history) {
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      if (ds >= startDateStr) allDates.add(ds);
    }
  }
  let dates = [...allDates].sort();
  dates = _maybeAppendTodayDate(dates, priced);
  if (dates.length < 2) return { dates, nav: [], error: 'Not enough trading days' };

  // Index trades
  const tradesByTickerDate = {};
  const tradesByDate = {};
  for (const t of trades) {
    if (!tradesByTickerDate[t.t]) tradesByTickerDate[t.t] = {};
    if (!tradesByTickerDate[t.t][t.d]) tradesByTickerDate[t.t][t.d] = [];
    tradesByTickerDate[t.t][t.d].push(t);
    if (!tradesByDate[t.d]) tradesByDate[t.d] = [];
    tradesByDate[t.d].push(t);
  }

  // Reconstruct qty per ticker per date.
  // For YTD window: jan1Qty = currentQty - net flow over window.
  // For 1M/3M window: similar, but only YTD trades in our ledger so we
  // walk net flow from start-of-window forward.
  const qtyMatrix = {};
  for (const p of priced) {
    // Compute the qty as of the start of the window:
    // qtyAtStart = currentQty - net flow from start-of-window through today
    const tradesInWindow = trades.filter(t => t.t === p.ticker && t.d >= startDateStr);
    const buyInWindow  = tradesInWindow.filter(t => t.a === 'B').reduce((s, t) => s + t.q, 0);
    const sellInWindow = tradesInWindow.filter(t => t.a === 'S').reduce((s, t) => s + t.q, 0);
    let qty = p.qty - buyInWindow + sellInWindow;
    qtyMatrix[p.ticker] = {};
    for (const ds of dates) {
      const tt = tradesByTickerDate[p.ticker]?.[ds] || [];
      for (const t of tt) qty += (t.a === 'B' ? t.q : -t.q);
      qtyMatrix[p.ticker][ds] = qty;
    }
  }

  // Close matrix with forward fill, SEEDED from the last close BEFORE the
  // window. Without the seed, staggered market openings (US Jan 2, HK Jan 5,
  // JPN Jan 4, etc.) cause NAV to ramp up over the first few days as each
  // market reports its first window bar — Modified Dietz then mis-reads
  // that ramp as a sub-period return. Seeding fixes the first-day artifact.
  // Adjclose-based close matrix with seed-from-last-bar-before-window.
  // Snapshot-aware: today's date (if appended) gets populated with p.mktPrice.
  const closeMatrix = {};
  const todayISO_ec = new Date().toISOString().slice(0, 10);
  for (const p of priced) {
    closeMatrix[p.ticker] = {};
    let lastCloseBeforeWindow = null;
    for (let i = p.history.length - 1; i >= 0; i--) {
      const bar = p.history[i];
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      if (ds < startDateStr) { lastCloseBeforeWindow = bar.adjclose != null ? bar.adjclose : bar.close; break; }
    }
    for (const bar of p.history) {
      const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
      const ds = d.toISOString().slice(0, 10);
      closeMatrix[p.ticker][ds] = bar.adjclose != null ? bar.adjclose : bar.close;
    }
    if (dates.length > 0 && dates[dates.length - 1] === todayISO_ec && p.mktPrice != null) {
      closeMatrix[p.ticker][todayISO_ec] = p.mktPrice;
    }
    let last = lastCloseBeforeWindow;
    for (const ds of dates) {
      if (closeMatrix[p.ticker][ds] != null) last = closeMatrix[p.ticker][ds];
      else if (last != null) closeMatrix[p.ticker][ds] = last;
    }
  }

  // CASH-INCLUDED-NAV: compute equity NAV per day, plus cash + bond/unpriced
  // constant, so total NAV reflects the full portfolio. Trades become
  // internal rotations between equity and cash buckets — no external CF.
  // FX-as-of-date: each historical NAV bar uses the FX rate observed on
  // that date (via fxAtDate), so FX drift no longer contaminates the
  // equity-only return signal.
  const equityAll = [], cfAll = [], untrackedNetAll = [];
  for (const ds of dates) {
    let n = 0;
    for (const p of priced) {
      const q = qtyMatrix[p.ticker][ds];
      const px = closeMatrix[p.ticker][ds];
      if (q > 0 && px != null) n += q * px * fxAtDate(p.ccy, ds);
    }
    equityAll.push(n);
    let c = 0, untracked = 0;
    for (const t of (tradesByDate[ds] || [])) {
      const pos = ps.find(p => p.ticker === t.t);
      const isPricedEquity = pos && pos.history && pos.history.length >= 50 && pos.type !== 'Bond' && pos.type !== 'Cash';
      if (isPricedEquity) {
        // Tracked position: the trade is an internal rotation between this curve's
        // equity sleeve and its cash pool. FX-as-of-trade-date (trade currency at
        // the time of execution).
        c += (t.a === 'B' ? 1 : -1) * t.q * t.p * fxAtDate(pos.ccy, t.d);
      } else {
        // Closed-out (untracked) position: its equity history is not in this curve,
        // so the trade cannot be a rotation. A sale enters the cash pool as an
        // EXTERNAL INFLOW; an in-year buy that was later fully closed is an EXTERNAL
        // OUTFLOW (cash left the curve into an untracked asset). The net is stripped
        // from the return — the round-trip P&L lives in the FIFO attribution, so
        // counting it here would double-count.
        untracked += (t.a === 'S' ? 1 : -1) * t.q * t.p * fxAtDate(t.ccy, t.d);
      }
    }
    cfAll.push(c);
    untrackedNetAll.push(untracked);
  }

  // Honest cash trajectory, reconstructed FORWARD from a near-zero 1 January
  // base. The book carried no material idle cash into the year — today's cash is
  // entirely tactical proceeds from recent sells awaiting redeployment. cfAll[i]
  // already holds each day's net equity trade flow in SGD (positive = bought, so
  // cash leaves the bucket; negative = sold, so cash enters it). We walk this
  // forward: sells add to cash, buys draw it down. When a purchase would drive
  // cash below zero, the shortfall was funded by an EXTERNAL DEPOSIT — not a
  // pre-existing cash pile — so we floor cash at zero and record the deposit as
  // a portfolio cash flow (it must not read as return). This replaces the old
  // back-walk, which set cash(Jan-1) = cashToday + Σ flows and thereby invented
  // a large phantom Jan-1 cash balance whenever net deployment was positive,
  // dragging the entire period against cash that never existed.
  const seedCash = 0;                        // 1 January idle cash (see note above)
  const cashSeries = new Array(equityAll.length);
  const depositSeries = new Array(equityAll.length).fill(0);
  let runningCash = seedCash;
  for (let i = 0; i < equityAll.length; i++) {
    // All sells add cash, all buys draw it down: tracked via −cfAll, closed-out
    // positions via the netted untracked term.
    runningCash += untrackedNetAll[i] - cfAll[i];
    if (runningCash < 0) { depositSeries[i] = -runningCash; runningCash = 0; }
    cashSeries[i] = runningCash;
  }

  // External portfolio cash flows per day = detected deposits (external funding of
  // purchases beyond available cash) plus the net closed-position flow (sale
  // proceeds in, in-year closed-out buys out). All raise or lower NAV without
  // being return, so Modified Dietz strips them out below.
  const externalFlowAll = depositSeries.map((d, i) => d + untrackedNetAll[i]);

  // Bonds + other unpriced positions are held at constant current value
  // (zero price movement assumed for bonds; V7AB Astrea has no Yahoo feed).
  // Bonds are excluded from the all-in equity curve scope (constant value, no
  // equity-style return — they would only flatten the chart's volatility
  // signal). Keep non-bond unpriced positions (none typical, but defensive).
  const constantOther = ps
    .filter(p => p.type !== 'Bond' && p.type !== 'Cash' && !p.history)
    .reduce((s, p) => s + (p.mktValueSGD || 0), 0);

  // Total all-in NAV per day. This is the number that should approximate
  // the landing-page Total Market Value when the window includes today.
  const navAll = equityAll.map((eq, i) => eq + cashSeries[i] + constantOther);

  // Trim leading zero-NAV days as before (still possible if first day has
  // no priced bars yet AND cash trajectory starts elsewhere).
  let firstReal = 0;
  while (firstReal < navAll.length && navAll[firstReal] <= 0) firstReal++;
  const trimmedDates = dates.slice(firstReal);
  const nav        = navAll.slice(firstReal);
  // Portfolio-level external cash flows (see externalFlowAll above): detected
  // deposits funding purchases, plus the net closed-position flow. Genuine equity
  // rotations net to zero across equity and cash and do not appear here. Modified
  // Dietz uses these to strip external funding from the return so flow-driven NAV
  // jumps do not read as performance.
  const cf         = externalFlowAll.slice(firstReal);
  dates.length = 0;
  trimmedDates.forEach(d => dates.push(d));

  // Daily Modified Dietz returns
  const dailyReturn = [0];
  for (let i = 1; i < dates.length; i++) {
    const bmv = nav[i - 1];
    const emv = nav[i];
    const c   = cf[i];
    dailyReturn.push(bmv > 0 ? ((emv - c) / bmv - 1) : 0);
  }

  // Cumulative TWRR-style return %
  const cumReturn = [];
  let cum = 1;
  for (let i = 0; i < dates.length; i++) {
    cum *= (1 + dailyReturn[i]);
    cumReturn.push((cum - 1) * 100);
  }

  // Drawdown: peak-to-current % at each day, using cumulative return as the "wealth index"
  const drawdown = [];
  let peakIdx = 0;
  let peakVal = cumReturn[0];
  let maxDD = { value: 0, date: dates[0], from: dates[0] };
  for (let i = 0; i < dates.length; i++) {
    if (cumReturn[i] > peakVal) { peakVal = cumReturn[i]; peakIdx = i; }
    // Drawdown from peak (in pp of cumulative return)
    const dd = (1 + cumReturn[i] / 100) / (1 + peakVal / 100) - 1;
    drawdown.push(dd * 100);
    if (dd * 100 < maxDD.value) {
      maxDD = { value: dd * 100, date: dates[i], from: dates[peakIdx] };
    }
  }

  // Best / worst day. UNIT FIX: compare daily returns in their native (fraction)
  // units, only multiply by 100 when storing the display value. Previous bug
  // stored best.r as percent then compared the next fraction against it, so
  // best/worst never updated past the first non-zero daily return — labelled
  // 'best.r_fraction' for marker.
  let best  = { date: dates[1] || dates[0], r_frac: -Infinity, return: 0 };
  let worst = { date: dates[1] || dates[0], r_frac:  Infinity, return: 0 };
  for (let i = 1; i < dates.length; i++) {
    if (dailyReturn[i] > best.r_frac)  best  = { date: dates[i], r_frac: dailyReturn[i], return: dailyReturn[i] * 100 };
    if (dailyReturn[i] < worst.r_frac) worst = { date: dates[i], r_frac: dailyReturn[i], return: dailyReturn[i] * 100 };
  }

  // Period-level Modified Dietz MWRR — independent cross-check on the daily-linked TWRR.
  //   MWRR = (EMV - BMV - netCF) / (BMV + Σ CF_i * (1 - days_from_start_i / total_days))
  // Each CF is weighted by its remaining time in the period. Less prone to
  // single-day artifacts than the daily geometric linking.
  const bmv0 = nav[0];
  const emv0 = nav[nav.length - 1];
  let netCF = 0, weightedCF = 0;
  const N = dates.length - 1;
  for (let i = 1; i < dates.length; i++) {
    netCF += cf[i];
    const w = N > 0 ? (1 - i / N) : 0;
    weightedCF += cf[i] * w;
  }
  const denom = bmv0 + weightedCF;
  const mwrrPct = denom > 0 ? ((emv0 - bmv0 - netCF) / denom) * 100 : 0;

  // ── Risk-adjusted return metrics ──
  // Convention: SG risk-free proxy = 3.5% (rough SSB / 6m T-bill ballpark).
  // Daily returns excluded from window start (i=0 = 0 by construction);
  // annualisation factor = 252.
  const rfAnnual = 0.035;
  const dailyRets = dailyReturn.slice(1);  // drop the seeded 0
  const meanDaily = dailyRets.length ? dailyRets.reduce((s, r) => s + r, 0) / dailyRets.length : 0;
  const varDaily  = dailyRets.length ? dailyRets.reduce((s, r) => s + (r - meanDaily) * (r - meanDaily), 0) / dailyRets.length : 0;
  const volAnnual = Math.sqrt(varDaily) * Math.sqrt(252);
  // Downside semi-deviation: only negative returns contribute.
  const downRets = dailyRets.filter(r => r < 0);
  const downSqMean = dailyRets.length ? downRets.reduce((s, r) => s + r * r, 0) / dailyRets.length : 0;
  const downVolAnnual = Math.sqrt(downSqMean) * Math.sqrt(252);
  // Annualised return from compounded cumulative return over window.
  const cumGross = 1 + (cumReturn[cumReturn.length - 1] || 0) / 100;
  const yearsElapsed = Math.max(dailyRets.length / 252, 1 / 252);
  const annReturn = cumGross > 0 ? Math.pow(cumGross, 1 / yearsElapsed) - 1 : 0;
  const sharpeRatio  = volAnnual     > 0 ? (annReturn - rfAnnual) / volAnnual     : 0;
  const sortinoRatio = downVolAnnual > 0 ? (annReturn - rfAnnual) / downVolAnnual : 0;
  const calmarRatio  = maxDD.value   < 0 ? annReturn / (Math.abs(maxDD.value) / 100) : 0;

  return {
    dates, nav, cf, dailyReturn, cumReturn, drawdown,
    startNav: nav[0],
    currentNav: nav[nav.length - 1],
    totalReturnPct: cumReturn[cumReturn.length - 1],
    mwrrPct,
    netCF,
    maxDrawdown: maxDD,
    bestDay: best,
    worstDay: worst,
    annReturn: annReturn * 100,
    annVol: volAnnual * 100,
    annDownVol: downVolAnnual * 100,
    sharpeRatio,
    sortinoRatio,
    calmarRatio,
    rfAnnual: rfAnnual * 100,
  };
}

// Window-start date for chart selectors. Returns ISO date string.
function _perfWindowStart(windowKey) {
  if (windowKey === 'YTD') return '2026-01-01';
  const today = new Date();
  if (windowKey === '1M') today.setMonth(today.getMonth() - 1);
  else if (windowKey === '3M') today.setMonth(today.getMonth() - 3);
  else if (windowKey === '6M') today.setMonth(today.getMonth() - 6);
  return today.toISOString().slice(0, 10);
}

// Render the equity-curve + drawdown card. Called by renderPerformance.
// Returns a benchmark cumulative-return series over the same window as the
// equity curve, rebased to 0% at the bar BEFORE the window start (so the
// benchmark and portfolio share the same anchor point). Uses adjclose for
// total return, and snapshot-aware closeNow when today's bar is missing.
//
// sym: 'STI' (-> ES3.SI), 'SPX' (-> S27.SI). Both are existing portfolio
// positions that double as benchmark proxies.
const BENCHMARK_TICKERS = { STI: 'ES3', SPX: 'S27' };
const BENCHMARK_LABELS  = { STI: 'STI Index (ES3.SI)', SPX: 'S&P 500 (S27.SI)' };

function getBenchmarkCurve(ps, sym, startDateStr) {
  if (!sym || sym === 'NONE') return null;
  const tk = BENCHMARK_TICKERS[sym];
  if (!tk) return null;
  const pos = ps.find(p => p.ticker === tk);
  if (!pos || !pos.history || pos.history.length === 0) return null;

  // Seed = last adjclose strictly before the window (so day-0 plots as 0%).
  let seed = null;
  for (let i = pos.history.length - 1; i >= 0; i--) {
    const bar = pos.history[i];
    const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
    const ds = d.toISOString().slice(0, 10);
    if (ds < startDateStr) { seed = bar.adjclose != null ? bar.adjclose : bar.close; break; }
  }
  // Filter history bars at or after window start.
  const window = [];
  for (const bar of pos.history) {
    const d = bar.date instanceof Date ? bar.date : new Date(bar.date);
    const ds = d.toISOString().slice(0, 10);
    if (ds >= startDateStr) window.push({ ds, adj: bar.adjclose != null ? bar.adjclose : bar.close });
  }
  if (window.length === 0) return null;
  const base = seed != null ? seed : window[0].adj;
  if (!isFinite(base) || base <= 0) return null;

  const dates = [];
  const cumReturn = [];
  for (const w of window) {
    dates.push(w.ds);
    cumReturn.push((w.adj / base - 1) * 100);
  }
  // Snapshot-aware extension: append today if snapshot fresher than last bar.
  const todayISO = new Date().toISOString().slice(0, 10);
  const lastBar = pos.history[pos.history.length - 1];
  const lastAdj = lastBar.adjclose != null ? lastBar.adjclose : lastBar.close;
  if (pos.mktPrice != null && Math.abs(pos.mktPrice - lastAdj) > 1e-6 && todayISO > dates[dates.length - 1]) {
    dates.push(todayISO);
    cumReturn.push((pos.mktPrice / base - 1) * 100);
  }
  return {
    ticker: tk,
    name: pos.name,
    label: BENCHMARK_LABELS[sym] || sym,
    dates,
    cumReturn,
    endReturn: cumReturn[cumReturn.length - 1],
  };
}

window.setPerfBenchmark = (b) => {
  state.perfBenchmark = b;
  renderEquityCurve('equityCurveCard', state.positions, TRADES_YTD, state.perfWindow || 'YTD');
};

// Renders the elapsed-window label under Annualised Return.
function yearsElapsed_label(daysCount) {
  if (daysCount < 21) return daysCount + 'd window';
  if (daysCount < 252) return (daysCount / 21).toFixed(1) + 'mo window';
  return (daysCount / 252).toFixed(2) + 'y window';
}

function renderEquityCurve(elId, ps, trades, windowKey) {
  const startDate = _perfWindowStart(windowKey);
  const curve = getEquityCurve(ps, trades, startDate);
  const container = document.getElementById(elId);
  if (!container) return;
  if (curve.error) {
    container.innerHTML = `<div style="padding:32px;text-align:center;color:var(--t3);font-size:13px">${curve.error}</div>`;
    return;
  }

  // Risk-adjusted stat strip — sits above the standard KPI grid.
  const fmtR = v => (v >= 0 ? '+' : '') + (isFinite(v) ? v.toFixed(2) : '—');
  const sharpeColour  = curve.sharpeRatio  >= 1   ? 'var(--g)' : curve.sharpeRatio  >= 0.5 ? 'var(--t1)' : curve.sharpeRatio  >= 0 ? 'var(--a)' : 'var(--r)';
  const sortinoColour = curve.sortinoRatio >= 1.4 ? 'var(--g)' : curve.sortinoRatio >= 0.7 ? 'var(--t1)' : curve.sortinoRatio >= 0 ? 'var(--a)' : 'var(--r)';
  const calmarColour  = curve.calmarRatio  >= 1   ? 'var(--g)' : curve.calmarRatio  >= 0.5 ? 'var(--t1)' : curve.calmarRatio  >= 0 ? 'var(--a)' : 'var(--r)';
  const riskAdjustedHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:14px;padding:12px 14px;background:var(--bg2);border-radius:6px">
      <div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Annualised Return</div>
        <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:${curve.annReturn >= 0 ? 'var(--g)' : 'var(--r)'}">${fmtPct(curve.annReturn)}</div>
        <div style="font-size:10px;color:var(--t3)">${yearsElapsed_label(curve.dailyReturn.length - 1)}</div>
      </div>
      <div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Annualised Vol</div>
        <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--t1)">${fmt(curve.annVol, 1)}%</div>
        <div style="font-size:10px;color:var(--t3)">total · downside ${fmt(curve.annDownVol, 1)}%</div>
      </div>
      <div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Sharpe</div>
        <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:${sharpeColour}">${fmtR(curve.sharpeRatio)}</div>
        <div style="font-size:10px;color:var(--t3)">(ann ret − ${fmt(curve.rfAnnual, 1)}%) / vol</div>
      </div>
      <div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Sortino</div>
        <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:${sortinoColour}">${fmtR(curve.sortinoRatio)}</div>
        <div style="font-size:10px;color:var(--t3)">vs downside vol only</div>
      </div>
      <div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Calmar</div>
        <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:${calmarColour}">${fmtR(curve.calmarRatio)}</div>
        <div style="font-size:10px;color:var(--t3)">ann ret / |max DD|</div>
      </div>
    </div>`;

  // Benchmark selector — must initialise BEFORE the kpis array uses it.
  // Default STI. Compute the benchmark curve only when a benchmark is
  // selected and the chart is in rebased % mode; otherwise it is null and
  // downstream uses gate on that.
  const mode_pre = state.perfChartMode || 'pct';
  const benchmarkSel = state.perfBenchmark || 'STI';
  const benchmarkCurve = (mode_pre === 'pct') ? getBenchmarkCurve(ps, benchmarkSel, startDate) : null;
  const alpha = benchmarkCurve ? (curve.totalReturnPct - benchmarkCurve.endReturn) : null;

  // YTD return reconciliation. A reader meets three different YTD percentages
  // across the dashboard. The two TWRR figures (this curve's whole-portfolio
  // number and the Attribution tab's equity-sleeve number) share one
  // methodology — daily Modified Dietz on dividend-adjusted closes, FX as of
  // each date — and differ only by scope, so equity-sleeve TWRR minus the idle
  // cash drag equals this curve's all-in TWRR by construction. The Attribution
  // FIFO "Portfolio Return" is a different lens and is shown as context, not
  // forced into the subtraction. YTD only, since that is the window where all
  // three figures are defined.
  let reconcileHTML = '';
  if (windowKey === 'YTD') {
    let twrrR = null, ytdR = null;
    try { twrrR = calcTwrr(ps, trades, startDate); } catch (e) { console.error('reconcile TWRR failed:', e); }
    try { ytdR  = calcYtdAttribution(ps, trades); }  catch (e) { console.error('reconcile YTD failed:', e); }
    if (twrrR && !twrrR.error && ytdR) {
      const eqTwrr   = twrrR.equityTwrr;       // equity sleeve only
      const allTwrr  = curve.totalReturnPct;   // whole portfolio including cash
      const cashDrag = eqTwrr - allTwrr;        // ties by construction
      const fifo     = ytdR.portfolioRetPct;    // FIFO P&L over the 1-Jan basis
      reconcileHTML = `
      <div style="margin-top:10px;padding:12px 14px;background:var(--bg2);border-radius:6px;font-size:11px;color:var(--t3);line-height:1.6">
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:8px">Reconciling the three YTD return figures</div>
        <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-bottom:8px">
          <span style="color:var(--t2)">Equity sleeve (TWRR, total return)</span>
          <span style="color:var(--g);font-weight:700">${fmtPct(eqTwrr)}</span>
          <span style="color:var(--t3)">${cashDrag >= 0 ? '−' : '+'}</span>
          <span style="color:var(--t2)">cash drag</span>
          <span style="color:var(--r);font-weight:700">${Math.abs(cashDrag).toFixed(2)} pp</span>
          <span style="color:var(--t3)">=</span>
          <span style="color:var(--t2)">whole portfolio (this curve)</span>
          <span style="color:var(--g);font-weight:700">${fmtPct(allTwrr)}</span>
        </div>
        <div>
          The two figures above share one method — daily Modified Dietz on dividend-adjusted closes — and differ only by scope, so the equity-sleeve return less the idle-cash drag equals this curve exactly. The Attribution tab additionally shows a <strong style="color:var(--t2)">Portfolio Return of ${fmtPct(fifo)}</strong>. That is also a total-return figure (dividends are now rolled in via dividend-adjusted closes), but computed differently: simple realised-plus-unrealised P&amp;L over the 1 January cost basis, at current FX. It does not tie to this curve by subtraction because it is money-weighted rather than time-weighted and uses current FX rather than the rate observed on each date — the cash-drag bridge above applies only between the two TWRR figures.
        </div>
      </div>`;
    }
  }

  // KPI strip values
  const kpis = [
    { label: 'Window Start NAV', value: fmtSGD(curve.startNav), sub: curve.dates[0] },
    { label: 'Current NAV',      value: fmtSGD(curve.currentNav), sub: curve.dates[curve.dates.length - 1] },
    { label: 'Total Return (TWRR)', value: fmtPct(curve.totalReturnPct), cls: curve.totalReturnPct >= 0 ? 'pos' : 'neg', sub: `${curve.dates.length} trading days · Modified Dietz daily` },
    { label: 'MWRR (cross-check)',  value: fmtPct(curve.mwrrPct), cls: curve.mwrrPct >= 0 ? 'pos' : 'neg', sub: `Δ ${(curve.mwrrPct - curve.totalReturnPct).toFixed(2)} pp vs TWRR${Math.abs(curve.mwrrPct - curve.totalReturnPct) > 3 ? ' ⚠' : ''}` },
    ...(benchmarkCurve ? [{ label: `vs ${benchmarkSel}`, value: (alpha >= 0 ? '+' : '') + alpha.toFixed(2) + ' pp', cls: alpha >= 0 ? 'pos' : 'neg', sub: `Bench ${fmtPct(benchmarkCurve.endReturn)} · You ${fmtPct(curve.totalReturnPct)}` }] : []),
    { label: 'Max Drawdown',     value: fmtPct(curve.maxDrawdown.value), cls: 'neg', sub: `${curve.maxDrawdown.from} → ${curve.maxDrawdown.date}` },
    { label: 'Best Day',         value: fmtPct(curve.bestDay.return),   cls: 'pos', sub: curve.bestDay.date },
    { label: 'Worst Day',        value: fmtPct(curve.worstDay.return),  cls: 'neg', sub: curve.worstDay.date },
  ];

  const winBtns = ['1M','3M','YTD'].map(w =>
    `<button class="fbtn ${w === windowKey ? 'active' : ''}" onclick="setPerfWindow('${w}')">${w}</button>`
  ).join('');
  const mode = state.perfChartMode || 'pct';
  const modeBtns = [['pct','%'],['nav','S$']].map(([k,label]) =>
    `<button class="fbtn ${k === mode ? 'active' : ''}" onclick="setPerfChartMode('${k}')">${label}</button>`
  ).join('');

  const benchBtns = [['STI','STI'],['SPX','S&P 500'],['NONE','None']].map(([k,label]) =>
    `<button class="fbtn ${k === benchmarkSel ? 'active' : ''}" onclick="setPerfBenchmark('${k}')">${label}</button>`
  ).join('');

  container.innerHTML = `
    <div class="card-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="card-title"><span class="indicator" style="background:var(--g)"></span>Equity Curve — ${mode === 'pct' ? 'Rebased Return' : 'Daily NAV'} with Drawdown</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;gap:4px;align-items:center" title="Chart axis: rebased to 0% at window start, or absolute S$ NAV">${modeBtns}</div>
        <div style="width:1px;height:18px;background:var(--bd)"></div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${winBtns}</div>
        <div style="width:1px;height:18px;background:var(--bd)"></div>
        <div style="display:flex;gap:4px;align-items:center" title="Benchmark overlay (rebased mode only)">${benchBtns}</div>
      </div>
    </div>
    <div class="card-body" style="padding-top:8px">
      ${riskAdjustedHTML}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px">
        ${kpis.map(k => `<div>
          <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">${k.label}</div>
          <div style="font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:${k.cls === 'pos' ? 'var(--g)' : k.cls === 'neg' ? 'var(--r)' : 'var(--t1)'}">${k.value}</div>
          <div style="font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:2px">${k.sub}</div>
        </div>`).join('')}
      </div>
      <div id="equityCurveChart" style="height:420px"></div>
      <!-- NAV-scope-note -->
      <div style="margin-top:10px;padding:10px 12px;background:var(--bg3);border-left:3px solid var(--b);border-radius:0 4px 4px 0;font-size:11px;color:var(--t3);line-height:1.55">
        <strong style="color:var(--t2)">Performance scope.</strong>
        Curve covers the equity sub-portfolio <em>plus</em> the cash actually held over time. Cash is rebuilt forward from a near-zero 1 January base — sells add to it, buys draw it down — so each tactical cash tranche drags only for the days it is genuinely held, not the whole year. Purchases funded from outside the book are detected as <strong>external deposits</strong> and stripped from the return; genuine equity-to-cash rotations net to zero. <strong>Singapore Savings Bonds and the V7AB PE bond are excluded</strong> — they generate no equity-style return and would just dilute the volatility signal. The landing-page <strong>Total Market Value of ${fmtSGD(state.totalValueSGD || 0)}</strong> additionally includes the bonds (~S\$260k) that this chart does not display.
      </div>
      ${reconcileHTML}
    </div>`;

  // Render Plotly chart
  setTimeout(() => {
    const ddY   = curve.drawdown;
    const isPct = (state.perfChartMode || 'pct') === 'pct';
    const navY  = isPct ? curve.cumReturn : curve.nav;
    // Pre-formatted hover strings (1 decimal). Plotly x-unified hover does
    // not reliably honour inline format specs on multi-trace traces, so we
    // drive the displayed readout via customdata pre-formatted strings.
    const primaryHover = isPct
      ? curve.cumReturn.map(v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%')
      : curve.nav.map(v => 'S$' + Math.round(v).toLocaleString('en-US'));
    const ddHover = curve.drawdown.map(v => v.toFixed(1) + '%');
    const trace1 = isPct ? {
      type: 'scatter', mode: 'lines', name: 'Return',
      x: curve.dates, y: navY,
      line: { color: 'rgba(26,135,84,0.95)', width: 2 },
      fill: 'tozeroy', fillcolor: 'rgba(26,135,84,0.08)',
      customdata: primaryHover,
      hovertemplate: '<b>%{x|%-d %b %Y}</b><br>Return: %{customdata}<extra></extra>',
      yaxis: 'y1',
    } : {
      type: 'scatter', mode: 'lines', name: 'Equity NAV',
      x: curve.dates, y: navY,
      line: { color: 'rgba(26,135,84,0.95)', width: 2 },
      fill: 'tozeroy', fillcolor: 'rgba(26,135,84,0.08)',
      customdata: primaryHover,
      hovertemplate: '<b>%{x|%-d %b %Y}</b><br>NAV: %{customdata}<extra></extra>',
      yaxis: 'y1',
    };
    const trace2 = {
      type: 'scatter', mode: 'lines', name: 'Drawdown',
      x: curve.dates, y: ddY,
      line: { color: 'rgba(192,57,43,0.6)', width: 1 },
      fill: 'tozeroy', fillcolor: 'rgba(192,57,43,0.18)',
      customdata: ddHover,
      hovertemplate: '<b>%{x|%-d %b %Y}</b><br>Drawdown: %{customdata}<extra></extra>',
      yaxis: 'y2',
    };
    if (!document.getElementById('equityCurveChart')) return;
    const traces = [trace1, trace2];
    if (isPct && benchmarkCurve) {
      const benchHover = benchmarkCurve.cumReturn.map(v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%');
      traces.push({
        type: 'scatter', mode: 'lines', name: benchmarkCurve.label,
        x: benchmarkCurve.dates, y: benchmarkCurve.cumReturn,
        line: { color: 'rgba(100,116,139,0.85)', width: 1.5, dash: 'dash' },
        customdata: benchHover,
        hovertemplate: '<b>%{x|%-d %b %Y}</b><br>' + benchmarkCurve.label + ': %{customdata}<extra></extra>',
        yaxis: 'y1',
      });
    }
    Plotly.newPlot('equityCurveChart', traces, {
      margin: { t: 10, b: 50, l: 70, r: 60 },
      paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
      font: { family: 'DM Sans', size: 11, color: '#5c5c56' },
      showlegend: !!(isPct && benchmarkCurve),
      legend: { x: 0, y: 1.05, orientation: 'h', font: { size: 10 } },
      hovermode: 'x unified',
      xaxis: { type: 'date', gridcolor: '#e2e0d8', tickfont: { size: 10 } },
      yaxis:  isPct
        ? { title: { text: 'Cumulative Return (%)', font: { size: 11 } }, gridcolor: '#e2e0d8', zerolinecolor: '#9a9890', zerolinewidth: 1, tickfont: { size: 10, family: 'JetBrains Mono' }, ticksuffix: '%', side: 'left' }
        : { title: { text: 'NAV (S$)', font: { size: 11 } }, gridcolor: '#e2e0d8', tickfont: { size: 10, family: 'JetBrains Mono' }, tickformat: ',.0f', side: 'left', rangemode: 'tozero' },
      yaxis2: { title: { text: 'Drawdown (%)', font: { size: 11, color: 'rgba(192,57,43,0.85)' } }, gridcolor: 'rgba(0,0,0,0)', tickfont: { size: 10, color: 'rgba(192,57,43,0.85)', family: 'JetBrains Mono' }, ticksuffix: '%', side: 'right', overlaying: 'y', rangemode: 'tozero' },
    }, { displayModeBar: false, responsive: true });
  }, 60);
}

window.setPerfWindow = (w) => {
  state.perfWindow = w;
  // Re-render only the equity curve container without nuking the whole tab.
  renderEquityCurve('equityCurveCard', state.positions, TRADES_YTD, w);
};

window.setPerfChartMode = (m) => {
  state.perfChartMode = m;
  renderEquityCurve('equityCurveCard', state.positions, TRADES_YTD, state.perfWindow || 'YTD');
};

function attrThemeColor(theme) {
  for (const [cat, list] of Object.entries(themeCats)) {
    if (list.includes(theme)) return themeCatColors[cat];
  }
  return '#6b7280';
}

function renderAttribution(el) {
  const ps = state.positions;
  const horizon = state.attrHorizon || '1M';
  const horizonDef = ATTR_HORIZONS.find(h => h.key === horizon) || ATTR_HORIZONS[2];
  const expanded = state.expandedAttrThemes = state.expandedAttrThemes || {};

  // YTD-FIX-2026-05-18: per-horizon try/catch so a single horizon's failure
  // does not block the others or swallow the click silently.
  const byHorizon = {};
  ATTR_HORIZONS.forEach(h => {
    try {
      byHorizon[h.key] = h.ytd
        ? calcYtdAttribution(ps, TRADES_YTD)
        : calcAttribution(ps, h.bars);
    } catch (err) {
      console.error('Attribution failed for horizon', h.key, err);
      byHorizon[h.key] = { error: err.message || String(err), bars: h.bars, totalStart: 0, totalDollar: 0, portfolioRetPct: 0, rows: [], themes: [], covered: 0, skipped: ps.length };
    }
  });
  const A = byHorizon[horizon];

  if (A && A.error) {
    el.innerHTML = `
      <div class="card mb">
        <div class="card-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div class="card-title"><span class="indicator" style="background:var(--r)"></span>Attribution failed for ${horizonDef.label}</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${ATTR_HORIZONS.map(h => `<button class="fbtn ${h.key === horizon ? 'active' : ''}" onclick="setAttrHorizon('${h.key}')">${h.label}</button>`).join('')}</div>
        </div>
        <div class="card-body" style="padding:24px 16px;color:var(--t3);font-size:13px;line-height:1.55">
          <div style="margin-bottom:8px"><strong style="color:var(--r)">Runtime error:</strong> <code style="background:var(--bg3);padding:2px 6px;border-radius:3px">${A.error}</code></div>
          <div style="color:var(--t4);font-size:11px">Check the browser console for the full stack trace. The other horizons (1D / 1W / 1M) may still work — click their buttons above.</div>
        </div>
      </div>`;
    return;
  }

  if (!A || A.covered === 0) {
    el.innerHTML = `
      <div class="card mb">
        <div class="card-head"><div class="card-title"><span class="indicator" style="background:var(--t3)"></span>Performance Attribution</div></div>
        <div class="card-body" style="text-align:center;padding:48px 16px;color:var(--t3);font-size:13px">
          Waiting for price history to load. Once <code>data/history.json</code> is in, the attribution decomposes 1D / 1W / 1M P&amp;L by theme.
        </div>
      </div>`;
    return;
  }

  const themesByContrib = [...A.themes].sort((a,b) => b.contribPp - a.contribPp);
  const positiveThemes  = themesByContrib.filter(t => t.contribPp >= 0);
  const topContribTheme = themesByContrib[0];
  const topDetractTheme = themesByContrib[themesByContrib.length - 1];

  const rowsByContrib = [...A.rows].sort((a,b) => b.contribPp - a.contribPp);
  const topPos = rowsByContrib.slice(0, 10);
  const botPos = rowsByContrib.slice(-10).reverse();

  const sumContrib = A.themes.reduce((s,t) => s + t.contribPp, 0);
  const reconciles = Math.abs(sumContrib - A.portfolioRetPct) < 0.01;
  const isYtd = horizonDef.ytd === true;
  const totalRealised   = isYtd ? A.rows.reduce((s,r) => s + (r.realisedSGD || 0), 0) : 0;
  const totalUnrealised = isYtd ? A.rows.reduce((s,r) => s + (r.unrealisedSGD || 0), 0) : 0;
  // Equity TWRR (Modified Dietz) only meaningful on YTD horizon.
  const twrr = isYtd ? (() => { try { return calcTwrr(ps, TRADES_YTD, '2026-01-01'); } catch (e) { console.error('TWRR calc failed:', e); return { equityTwrr: 0, error: e.message }; } })() : null;

  const horizonBtns = ATTR_HORIZONS.map(h => `
    <button class="fbtn ${h.key === horizon ? 'active' : ''}" onclick="setAttrHorizon('${h.key}')">${h.label}</button>
  `).join('');

  const maxAbsContrib = Math.max(0.01, ...A.themes.map(t => Math.abs(t.contribPp)));

  // Theme heatmap matrix. Filter out themes with no recorded P&L across all
  // horizons (closed-out positions with unknown pre-YTD basis) so the heatmap
  // stays focused on themes that actually drove return.
  const allThemes = new Set();
  ATTR_HORIZONS.forEach(h => byHorizon[h.key].themes.forEach(t => {
    const hasRealValue = t.contribPp != null && isFinite(t.contribPp) && t.contribPp !== 0;
    if (hasRealValue) allThemes.add(t.theme);
  }));
  const themesOrdered = [...allThemes].sort((a,b) => {
    const ca = byHorizon[horizon].themes.find(t => t.theme === a)?.contribPp ?? -Infinity;
    const cb = byHorizon[horizon].themes.find(t => t.theme === b)?.contribPp ?? -Infinity;
    return cb - ca;
  });
  let heatMaxAbs = 0;
  ATTR_HORIZONS.forEach(h => byHorizon[h.key].themes.forEach(t => { heatMaxAbs = Math.max(heatMaxAbs, Math.abs(t.contribPp)); }));
  heatMaxAbs = Math.max(heatMaxAbs, 0.01);
  const cellBg = v => {
    if (v == null || !isFinite(v)) return 'var(--bg3)';
    const int = Math.min(Math.abs(v) / heatMaxAbs, 1);
    return v >= 0
      ? `rgba(26,135,84,${0.07 + int*0.55})`
      : `rgba(192,57,43,${0.07 + int*0.50})`;
  };
  const cellFg = v => (v == null) ? 'var(--t4)' : (Math.abs(v) / heatMaxAbs > 0.5 ? '#fff' : 'var(--t1)');

  // Book return = equity + cash, bonds excluded — the same basis as the hero
  // P&L cards and the Performance curve. The headline "Portfolio Return" tile
  // reports this. The theme decomposition (contributions, waterfall, heatmap)
  // stays on the EQUITY denominator — that is what the contributions sum to, so
  // those totals are labelled "Equity sleeve". For period horizons the start-of-
  // period book NAV is recovered via the rotation-conserving identity (book NAV
  // moves only by P&L over a flow-free window): denom = nonBondNow − equity P&L.
  // For YTD, cash was ~zero at 1 Jan, so the book basis collapses to the equity
  // basis and bookRetPct equals equityRetPct.
  // Portfolio Return headline = trade-aware equity+cash book return, identical to
  // the hero P&L cards. For period horizons it comes from the trade-aware engine
  // (captures positions closed within the window); for YTD it is the FIFO total
  // return (already trade-aware). The theme decomposition below stays on CURRENT
  // HOLDINGS, so it reconciles to the held-equity return — for period horizons
  // that differs from the headline by the realised P&L of positions closed in the
  // window plus the cash effect.
  const heldEquityRetPct = A.portfolioRetPct;             // what the theme contributions sum to (held equity)
  const periodTA = isYtd ? null : calcPortfolioPeriodPnL(ps, TRADES_YTD, horizonDef.bars);
  const bookRetPct = isYtd ? heldEquityRetPct : (periodTA ? periodTA.pct : 0);
  const headlineDollar = isYtd ? A.totalDollar : (periodTA ? periodTA.pnl : 0);

  // Build HTML in chunks to keep template literals small and readable
  const headerCard = `
    <div class="card mb">
      <div class="card-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div class="card-title"><span class="indicator" style="background:var(--b)"></span>Performance Attribution — Contribution to Return by Theme</div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${horizonBtns}</div>
      </div>
      <div class="card-body" style="padding-top:8px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px">
          <div title="Equity + cash book return (bonds excluded), trade-aware and identical to the hero P&L cards. The theme decomposition below covers current holdings; for period horizons it reconciles to the held-equity return, which differs from this headline by the realised P&L of positions closed in the window plus the cash effect.">
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Portfolio Return · ${horizonDef.label}</div>
            <div style="font-family:var(--sans);font-size:22px;font-weight:700;color:${bookRetPct>=0?'var(--g)':'var(--r)'}">${fmtPct(bookRetPct)}</div>
            <div style="font-size:12px;color:var(--t2)">${fmtPL(headlineDollar)} · equity + cash basis${isYtd ? '' : ' · trade-aware'}</div>
          </div>
          ${isYtd && twrr && !twrr.error ? `
          <div title="Modified Dietz time-weighted return on the equity sub-portfolio. Removes the effect of when capital was deployed during the year; treats each trade as an external cash flow into/out of the equity bucket. The CFA / GIPS standard for performance reporting.">
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Equity TWRR · YTD</div>
            <div style="font-family:var(--sans);font-size:22px;font-weight:700;color:${twrr.equityTwrr>=0?'var(--g)':'var(--r)'}">${fmtPct(twrr.equityTwrr)}</div>
            <div style="font-size:12px;color:var(--t2)">Modified Dietz · ${twrr.days} trading days · ${twrr.flowCount} flows</div>
          </div>` : ''}
          <div>
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Top Contributor</div>
            <div style="font-family:var(--sans);font-size:14px;font-weight:700;color:var(--t1);line-height:1.25">${topContribTheme && topContribTheme.contribPp > 0 ? topContribTheme.theme : '—'}</div>
            <div style="font-size:11px;color:var(--g);font-family:var(--mono)">${topContribTheme && topContribTheme.contribPp > 0 ? fmtPct(topContribTheme.contribPp)+' pp' : ''}</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Top Detractor</div>
            <div style="font-family:var(--sans);font-size:14px;font-weight:700;color:var(--t1);line-height:1.25">${topDetractTheme && topDetractTheme.contribPp < 0 ? topDetractTheme.theme : '—'}</div>
            <div style="font-size:11px;color:var(--r);font-family:var(--mono)">${topDetractTheme && topDetractTheme.contribPp < 0 ? fmtPct(topDetractTheme.contribPp)+' pp' : ''}</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Themes Positive</div>
            <div style="font-family:var(--sans);font-size:22px;font-weight:700;color:var(--t1)">${positiveThemes.length}<span style="font-size:14px;color:var(--t3);font-weight:500"> / ${A.themes.length}</span></div>
            <div style="font-size:12px;color:var(--t2)">${A.covered} priced · ${A.skipped} excluded</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Reconciliation</div>
            <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:${reconciles?'var(--g)':'var(--r)'}">${fmtPct(sumContrib)}</div>
            <div style="font-size:12px;color:var(--t2)">Σ contribs vs ${fmtPct(heldEquityRetPct)} held-equity return</div>
          </div>
          ${isYtd ? `
          <div>
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">Realised P&L · YTD</div>
            <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:${totalRealised>=0?'var(--g)':'var(--r)'}">${fmtPL(totalRealised)}</div>
            <div style="font-size:12px;color:var(--t2)">closed lots, FIFO across ${A.rows.filter(r => Math.abs(r.realisedSGD || 0) > 0.5).length} tickers</div>
          </div>

// ═══════════════════════════════════════════════════════════════
// Track data version — increments when live data arrives
let _dataVersion = 0;
const _paneVersion = {}; // tracks which version each pane was rendered at

function renderTab(forceAll) {
  const tabs = ['positions','attribution','signals','allocation','performance','risk'];
  // Show/hide panes
  tabs.forEach(t => {
    document.getElementById('pane-'+t).style.display = t === state.tab ? '' : 'none';
  });
  // Only render if data changed since last render of this pane, or forceAll
  const pane = document.getElementById('pane-'+state.tab);
  if (forceAll || _paneVersion[state.tab] !== _dataVersion) {
    switch(state.tab) {
      case 'positions': renderPositions(pane); break;
      case 'allocation': renderAllocation(pane); break;
      case 'performance': renderPerformance(pane); break;
      case 'attribution': renderAttribution(pane); break;
      case 'signals': renderSignals(pane); break;
      case 'risk': renderRisk(pane); break;
    }
    _paneVersion[state.tab] = _dataVersion;
  }
}

function invalidateAllPanes() {
  _dataVersion++;
  // Force re-render of current visible tab
  _paneVersion[state.tab] = -1;
  renderTab();
}

document.getElementById('tabBar').addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    state.tab = e.target.dataset.tab;
    renderTab();
  }
});

window.setFilter = f => { state.filter = f; _paneVersion[state.tab] = -1; renderTab(); };
window.setSort = col => {
  if (state.sort.col===col) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
  else { state.sort.col=col; state.sort.dir='desc'; }
  _paneVersion[state.tab] = -1; renderTab();
};

//  INIT — Preload-aware: instant render from embedded data
// ═══════════════════════════════════════════════════════════════

function loadPreloadedData() {
  // Convert PRELOADED_HISTORY into the liveData format used by enrichAll()
  const results = {};
  const preloadKeys = Object.keys(PRELOADED_HISTORY);
  if (preloadKeys.length === 0) return null;

  for (const sym of preloadKeys) {
    const entry = PRELOADED_HISTORY[sym];
    if (!entry) continue;
    // FX entries (symbol contains '=')
    if (sym.includes('=')) {
      // FX symbols: keep the daily series so _buildFxHistory can populate
      // FX_HISTORY and fxAtDate() can convert at the rate observed on each date.
      // (Previously hardcoded to [], which silently disabled FX-as-of-date.)
      results[sym] = { price: entry.price, prevClose: entry.prevClose, dayChange: 0, dayChangePct: 0, history: historyToFull(entry.history || []) };
      continue;
    }
    results[sym] = {
      price: entry.price,
      prevClose: entry.prevClose,
      dayChange: entry.price - (entry.prevClose || entry.price),
      dayChangePct: entry.prevClose ? ((entry.price - entry.prevClose) / entry.prevClose) * 100 : 0,
      history: historyToFull(entry.history || [])
    };
  }
  // Update FX from preloaded
  if (results['HKDSGD=X']) FX.HKD = results['HKDSGD=X'].price;
  if (results['JPYSGD=X']) FX.JPY = results['JPYSGD=X'].price;
  if (results['USDSGD=X']) FX.USD = results['USDSGD=X'].price;
  if (results['AUDSGD=X']) FX.AUD = results['AUDSGD=X'].price;
  if (results['EURSGD=X']) FX.EUR = results['EURSGD=X'].price;
  // Populate FX_HISTORY (sorted ASC, ISO date strings + rate). Used by
  // fxAtDate() for time-varying FX in historical-NAV reconstruction.
  _buildFxHistory(results);
  return results;
}

// Quiet, pill-only live refresh. The dashboard stays on baked data while the
// fetch runs in the background; on completion the headline values tween to live
// (renderKPIs) and the header pill stamps the time. Auto-refresh on load is
// controlled by the pccAutoRefresh localStorage flag (default on) in init().
window.refreshPrices = async function() {
  const pill = document.getElementById('statusPill');
  pill.className = 'pill pill-loading';
  pill.textContent = '◌ updating';
  const _prog = document.getElementById('fetchProgress');
  if (_prog) _prog.style.display = 'none';   // pill-only — no progress bar

  // Quiet, pill-only refresh: the dashboard stays on baked data while fetching,
  // and the headline values tween to live when the fetch lands (renderKPIs). No
  // progress bar — the header pill is the only indicator.
  try {
    const liveData = await fetchAllPrices();
    const liveCount = Object.keys(liveData).filter(k => !k.includes('=')).length;
    if (liveCount > 0) {
      state.liveData = liveData;
      state.dataSource = 'live';
      enrichAll();
      renderKPIs();
      invalidateAllPanes();
      const sigCount = state.positions.filter(p => p.trendSignals && p.trendSignals.source === 'live').length;
      // Stamp the refresh time on the header pill (runtime clock — display of
      // "now", not date arithmetic). Singapore locale, 24-hour.
      const refreshedAt = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      pill.className = 'pill pill-live';
      pill.textContent = `● ${sigCount} LIVE · ${refreshedAt}`;
    } else {
      pill.className = 'pill pill-date';
      pill.textContent = PRELOADED_DATE ? `📊 ${PRELOADED_DATE}` : '📊 baked';
    }
  } catch(e) {
    pill.className = 'pill pill-date';
    pill.textContent = PRELOADED_DATE ? `📊 ${PRELOADED_DATE}` : '📊 baked';
  }
};

async function init() {
  renderDate();

  const hasPreload = Object.keys(PRELOADED_HISTORY).length > 0;

  if (hasPreload) {
    // ── INSTANT PATH: Embedded data available ──
    const preloaded = loadPreloadedData();
    state.liveData = preloaded;
    state.dataSource = 'preloaded';
    enrichAll();
    renderKPIs();
    _dataVersion++;
    renderTab();
    document.getElementById('loadingOverlay').style.display = 'none';

    const sigCount = state.positions.filter(p => p.trendSignals && p.trendSignals.source === 'live').length;
    const pill = document.getElementById('statusPill');
    pill.className = 'pill pill-live';
    pill.textContent = PRELOADED_DATE ? `📊 ${PRELOADED_DATE}` : `📊 ${sigCount} PRELOADED`;

    // Auto-upgrade to live prices on load (one-shot), unless turned off. The
    // instant baked render above stays on screen until the live fetch lands; on
    // failure it silently remains on baked data. Baked EOD is the reliable
    // backbone — this is a best-effort live overlay, fetched once per load (no
    // periodic polling, to stay light on the public CORS proxies).
    if (localStorage.getItem('pccAutoRefresh') !== 'off') {
      refreshPrices();              // pill-only; values tween to live when the fetch lands
    }
    return;
  }

  // ── FETCH PATH: No preloaded data — render from SNAPSHOT, then
  //    on localhost only, auto-fetch live from Yahoo Finance.
  //    Phase 2: data/*.json is the sole source of truth in production;
  //    failure to load it means we serve SNAPSHOT and stop rather than
  //    hammer public CORS proxies. The live-fetch fallback below is
  //    retained as a local-dev convenience only.
  enrichAll();
  renderKPIs();
  _dataVersion++;
  renderTab();
  document.getElementById('loadingOverlay').style.display = 'none';

  if (!isLocalhost()) {
    document.getElementById('statusPill').className = 'pill pill-date';
    document.getElementById('statusPill').textContent = '◌ SNAPSHOT';
    return;
  }

  // Then auto-fetch in background with progress bar (localhost dev only).
  try {
    document.getElementById('statusPill').className = 'pill pill-loading';
    document.getElementById('statusPill').textContent = '◌ FETCHING';

    const liveData = await fetchAllPrices();
    const liveCount = Object.keys(liveData).filter(k => !k.includes('=')).length;
    const withHistory = Object.values(liveData).filter(d => d.history && d.history.length >= 15).length;

    if (liveCount > 0) {
      state.liveData = liveData;
      state.dataSource = liveCount >= 15 ? 'live' : 'partial';
      enrichAll();
      renderKPIs();
      invalidateAllPanes();

      const sigCount = state.positions.filter(p => p.trendSignals && p.trendSignals.source === 'live').length;
      const pill = document.getElementById('statusPill');
      if (sigCount >= 10) {
        pill.className = 'pill pill-live';
        pill.textContent = `● ${sigCount} SIGNALS`;
      } else if (withHistory > 0) {
        pill.className = 'pill pill-live';
        pill.style.background = '#92400e';
        pill.textContent = `◐ ${withHistory} CACHED`;
      } else {
        pill.className = 'pill pill-date';
        pill.textContent = '◌ SNAPSHOT';
      }
    } else {
      document.getElementById('statusPill').className = 'pill pill-date';
      document.getElementById('statusPill').textContent = '◌ SNAPSHOT';
    }
  } catch(e) {
    document.getElementById('statusPill').className = 'pill pill-date';
    document.getElementById('statusPill').textContent = '◌ SNAPSHOT';
  }
}

// ═══════════════════════════════════════════════════════════════
//  DATA BOOTSTRAP — Fetch baked data from data/*.json at startup
//  Phase 2: the build pipeline writes data/history.json (stock OHLC),
//  data/fx.json (FX rates) and data/meta.json (build date, ticker list)
//  into the repo; the client fetches them here before init() runs.
//  On localhost, if the three files are missing, init()'s live-fetch
//  path takes over as a dev convenience. In production, missing data
//  falls through to a SNAPSHOT render rather than any upstream call.
// ═══════════════════════════════════════════════════════════════
function isLocalhost() {
  const h = location.hostname;
  return h === 'localhost' || h === '127.0.0.1' || h === '';
}

async function fetchDataFile(name) {
  const resp = await fetch('data/' + name, { cache: 'default' });
  if (!resp.ok) throw new Error(name + ' ' + resp.status);
  return resp.json();
}

async function bootstrap() {
  const pill = document.getElementById('statusPill');
  if (pill) {
    pill.className = 'pill pill-loading';
    pill.textContent = '◌ LOADING DATA';
  }

  try {
    const [hist, fx, meta] = await Promise.all([
      fetchDataFile('history.json'),
      fetchDataFile('fx.json'),
      fetchDataFile('meta.json'),
    ]);
    PRELOADED_HISTORY = Object.assign({}, hist, fx);
    PRELOADED_DATE = (meta && meta.date) ? meta.date : '';
  } catch (e) {
    console.warn('[bootstrap] data/*.json load failed:', e.message);
    // Leave PRELOADED_HISTORY empty; init() will take the FETCH PATH,
    // which is gated to localhost-only per the Phase 2 design.
  }

  await init();
}

bootstrap();
</script>
