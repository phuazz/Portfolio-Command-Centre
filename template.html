// Shared helper for return calculations across the dashboard.
// Returns { closeNow, closeThen, snapshotFresher } using adjusted-close for
// total return (so dividends are included). Treats the live snapshot
// p.mktPrice as today's virtual bar when it differs from the latest history
// bar — at the latest bar adjclose equals raw close by Yahoo convention, so
// the snapshot can stand in as today's adj price.
//
// `lookbackBars` is the number of trading bars back for closeThen
//   (1 = 1-day return, 5 = 1-week, 21 = 1-month).
// Returns null when there is not enough history to compute.
function effectiveReturn(p, lookbackBars) {
  if (!p || !p.history || p.history.length < 2) return null;
  const n = p.history.length;
  const lastBar = p.history[n - 1];
  const lastAdj = lastBar.adjclose != null ? lastBar.adjclose : lastBar.close;
  if (!isFinite(lastAdj) || lastAdj <= 0) return null;
  const snapshotFresher = p.mktPrice != null && Math.abs(p.mktPrice - lastAdj) > 1e-6;
  const closeNow = snapshotFresher ? p.mktPrice : lastAdj;
  const refIdx = snapshotFresher
    ? Math.max(0, n - lookbackBars)
    : Math.max(0, n - 1 - lookbackBars);
  if (refIdx < 0) return null;
  const refBar = p.history[refIdx];
  const closeThen = refBar.adjclose != null ? refBar.adjclose : refBar.close;
  if (!isFinite(closeNow) || !isFinite(closeThen) || closeThen <= 0) return null;
  const refDateObj = refBar.date instanceof Date ? refBar.date : new Date(refBar.date);
  const refDate = refDateObj.toISOString().slice(0, 10);
  return { closeNow, closeThen, snapshotFresher, refDate };
}

// Trade-aware portfolio-level period P&L.
//
// Marks every ticker that was held at the window start OR traded within the
// window — so positions CLOSED mid-window (their qty is now zero and they have
// left POSITIONS) are still captured. For each ticker the market gain is the
// mark-to-market identity P&L = (endValue − startValue) − netCashInvested,
// summed in SGD with FX-as-of-date on adjclose (total return). Bonds carry no
// market P&L; foreign cash contributes its FX move only (added after the equity
// loop). This fixes the earlier engine, which marked only current
// holdings and so dropped the in-window move of anything sold during the period
// (e.g. a stock closed out on the day would silently vanish from the 1-Day P&L).
//
// The % is the equity+cash book return via the rotation-conserving denominator
// (nonBondNow − pnl); equityPct uses the same numerator over the equity-only
// denominator, so (pct − equityPct) isolates the cash cushion.
function calcPortfolioPeriodPnL(ps, trades, barsBack) {
  const liveData = state.liveData || {};
  const histOf = yf => (yf && liveData[yf] && liveData[yf].history) || null;

  // Universe = current priced equities + every traded ticker (so closed names in).
  const meta = {};
  const add = (tk, yf, ccy) => { if (tk && !meta[tk]) meta[tk] = { yf, ccy }; };
  ps.forEach(p => { if (p.type !== 'Bond' && p.type !== 'Cash') add(p.ticker, p.yf, p.ccy); });
  trades.forEach(t => add(t.t, t.yf, t.ccy));
  const tickers = Object.keys(meta);

  let equityPnl = 0, count = 0;
  for (const tk of tickers) {
    const { yf, ccy } = meta[tk];
    const h = histOf(yf);
    if (!h || h.length < 2) continue;
    const n = h.length;
    const lastBar = h[n - 1];
    const lastAdj = lastBar.adjclose != null ? lastBar.adjclose : lastBar.close;
    if (!isFinite(lastAdj) || lastAdj <= 0) continue;
    const pos = ps.find(p => p.ticker === tk);

    // Per-ticker window, identical to effectiveReturn(): the live snapshot stands
    // in as a virtual "today" bar ONLY when it genuinely differs from the last
    // baked bar, and the lookback is counted in THIS ticker's own bars. Deciding
    // this per ticker — rather than once on a shared date axis — is essential:
    // the earlier global axis appended a synthetic "today" whenever any single
    // symbol looked fresher (or carried a weekend bar), which shifted every
    // ticker's window to (last close, today] and collapsed the 1-Day move to ~0.
    const curPrice = pos ? pos.mktPrice : (liveData[yf] ? liveData[yf].price : lastAdj);
    const snapshotFresher = curPrice != null && Math.abs(curPrice - lastAdj) > 1e-6;
    const pNow = snapshotFresher ? curPrice : lastAdj;
    const refIdx = snapshotFresher ? Math.max(0, n - barsBack) : Math.max(0, n - 1 - barsBack);
    const startBar = h[refIdx];
    const pStart = startBar.adjclose != null ? startBar.adjclose : startBar.close;
    if (!isFinite(pStart) || pStart <= 0) continue;
    const sd = startBar.date instanceof Date ? startBar.date : new Date(startBar.date);
    const startDateTk = sd.toISOString().slice(0, 10);

    const qtyNow = pos ? pos.qty : 0;
    const wTrades = trades.filter(t => t.t === tk && t.d > startDateTk);   // trades after the start mark
    const buysW  = wTrades.filter(t => t.a === 'B').reduce((s, t) => s + t.q, 0);
    const sellsW = wTrades.filter(t => t.a === 'S').reduce((s, t) => s + t.q, 0);
    const qtyStart = qtyNow - buysW + sellsW;
    if (qtyStart === 0 && wTrades.length === 0) continue;                  // not held at start, not traded in window

    const fxNow = pos ? (pos.fxRate || 1) : (FX[ccy] || 1);
    const startVal = qtyStart * pStart * fxAtDate(ccy, startDateTk);
    const endVal   = qtyNow   * pNow   * fxNow;
    let netFlow = 0;
    for (const t of wTrades) netFlow += (t.a === 'B' ? 1 : -1) * t.q * t.p * fxAtDate(ccy, t.d);
    equityPnl += endVal - startVal - netFlow;
    count++;
  }

  // Cash buckets carry no price, but foreign cash is an open FX position against
  // the SGD base, so its only P&L is the FX move. Mark each non-SGD bucket over
  // the same bar count via FX_HISTORY (current rate vs barsBack trading days
  // back). When the FX series is too short (e.g. a thin JPY series) fxThen falls
  // back to fxNow, so the contribution is zero rather than wrong. Approximation:
  // the current balance is treated as held across the window; for a tactical
  // tranche raised mid-window this slightly overstates the exposure period, which
  // is immaterial over 1D–1M.
  let cashFxPnl = 0;
  for (const p of ps) {
    if (p.type !== 'Cash' || p.ccy === 'SGD') continue;
    const fxNow = p.fxRate || FX[p.ccy] || 1;
    const ser = (typeof FX_HISTORY !== 'undefined') ? FX_HISTORY[p.ccy] : null;
    const fxThen = (ser && ser.length >= barsBack + 1) ? ser[ser.length - 1 - barsBack].rate : fxNow;
    cashFxPnl += p.qty * (fxNow - fxThen);
  }
  const totalPnl = equityPnl + cashFxPnl;

  const nonBondNow = ps.filter(p => p.type !== 'Bond').reduce((s, p) => s + (p.mktValueSGD || 0), 0);
  const equityNow  = ps.filter(p => p.type !== 'Bond' && p.type !== 'Cash').reduce((s, p) => s + (p.mktValueSGD || 0), 0);
  const bookDenom = nonBondNow - totalPnl;
  const eqDenom   = equityNow  - equityPnl;
  return {
    pnl: totalPnl,                                                        // total book P&L (equity price+FX, plus cash FX)
    pct:       bookDenom > 0 ? (totalPnl  / bookDenom) * 100 : 0,         // equity + cash book return
    equityPct: eqDenom   > 0 ? (equityPnl / eqDenom)   * 100 : 0,         // equity sleeve only (tooltip)
    count,
  };
}

function renderKPIs() {
  const ps = state.positions;
  const cdpPs = ps.filter(p=>p.account==='CDP');
  const scPs = ps.filter(p=>p.account!=='CDP');
  const cdpValue = cdpPs.reduce((s,p)=>s+p.mktValueSGD,0);
  const scValue = scPs.reduce((s,p)=>s+p.mktValueSGD,0);
  // Period P&L: trade-aware over 1 / 5 / 21 trading days — captures positions
  // closed within the window, not just current holdings.
  const d1 = calcPortfolioPeriodPnL(ps, TRADES_YTD, 1);
  const w1 = calcPortfolioPeriodPnL(ps, TRADES_YTD, 5);
  const m1 = calcPortfolioPeriodPnL(ps, TRADES_YTD, 21);
  // YTD P&L: trade-aware FIFO total return (realised + unrealised) — the same
  // figure as the Attribution tab headline. Unlike the fixed-bar cards above, a
  // YTD mark-to-market would mishandle this year's heavy intra-year trading, so
  // this uses the lot-accounting engine instead.
  let ytd = { totalDollar: 0, portfolioRetPct: 0 };
  try { ytd = calcYtdAttribution(ps, TRADES_YTD); } catch (e) { console.error('YTD KPI calc failed:', e); }

  // Hero P&L cards report the equity + cash book return (bonds excluded, matching
  // the Performance curve), with the equity sleeve in the tooltip. Both percentages
  // come straight from the trade-aware period engine.
  const pnlKpi = (label, data) => ({
    label, value: fmtPL(data.pnl), num: data.pnl, fmt: fmtPL, sub: fmtPct(data.pct), cls: data.pnl >= 0 ? 'pos' : 'neg',
    title: `Equity + cash basis (bonds excluded). Equity sleeve alone: ${fmtPct(data.equityPct)}`,
  });

  const kpis = [
    { label:'Total Market Value', value:fmtSGD(state.totalValueSGD), num: state.totalValueSGD, fmt: fmtSGD, sub:`Brokerage ${fmtSGD(scValue)} · CDP ${fmtSGD(cdpValue)}` },
    pnlKpi('1-Day P&L', d1),
    pnlKpi('1-Week P&L', w1),
    pnlKpi('1-Month P&L', m1),
    { label:'YTD P&L', value:fmtPL(ytd.totalDollar), num: ytd.totalDollar, fmt: fmtPL, sub:fmtPct(ytd.portfolioRetPct), cls: ytd.totalDollar >= 0 ? 'pos' : 'neg', title:'Equity + cash basis. Cash was ~zero at 1 Jan, so this equals the equity-sleeve YTD return.' },
    { label:'Positions', value:`${ps.length}`, sub:`${scPs.length} Brokerage · ${cdpPs.length} CDP` },
  ];

  const strip = document.getElementById('kpiStrip');
  strip.innerHTML = kpis.map(k=>`
    <div class="kpi"${k.title ? ` title="${k.title}"` : ''}>
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val ${k.cls||''}">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>
  `).join('');

  // Animate numeric headline values from their previously-shown figure to the
  // new one, so the portfolio value and P&L tween smoothly when prices update —
  // the "live" feel. Only animates when the value actually changed (a price
  // update), not on plain re-renders such as tab switches.
  if (!window._kpiPrev) window._kpiPrev = {};
  const cards = strip.querySelectorAll('.kpi');
  kpis.forEach((k, i) => {
    if (k.num == null || !isFinite(k.num) || !k.fmt) return;
    const el = cards[i] && cards[i].querySelector('.kpi-val');
    if (!el) return;
    const prev = window._kpiPrev[k.label];
    if (prev != null && isFinite(prev) && Math.abs(prev - k.num) > 0.5) {
      tweenNumber(el, prev, k.num, k.fmt, 650);
    }
    window._kpiPrev[k.label] = k.num;
  });
}

// Animate a DOM element's numeric text from `from` to `to` over `dur` ms with an
// ease-out, formatting each frame via `fmt`. Sets the start value synchronously
// so there is no flash of the final number before the animation begins.
function tweenNumber(el, from, to, fmt, dur) {
  if (!el) return;
  dur = dur || 650;
  el.dataset.tweenTo = String(to);   // guards against overlapping tweens (latest wins)
  el.textContent = fmt(from);
  const start = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  function frame(now) {
    if (el.dataset.tweenTo !== String(to)) return;   // a newer tween superseded this one
    const t = Math.min(1, (now - start) / dur);
    el.textContent = fmt(from + (to - from) * ease(t));
    if (t < 1) requestAnimationFrame(frame);
    else el.textContent = fmt(to);
  }
  requestAnimationFrame(frame);
  // Safety net: requestAnimationFrame is throttled when the tab is not painting,
  // which could leave the number frozen mid-animation. Force the final value
  // after the duration so the displayed figure is always correct.
  setTimeout(() => { if (el.dataset.tweenTo === String(to)) el.textContent = fmt(to); }, dur + 80);
}

function renderPositions(el) {
  const isBond = p => p.type === 'Bond';
  const allFiltered = state.filter === 'ALL' ? [...state.positions] :
    state.positions.filter(p => regionMap[p.exchange]===state.filter);

  // Split equities/ETFs/REITs from bonds
  const equities = allFiltered.filter(p => !isBond(p));
  const bonds = allFiltered.filter(p => isBond(p));

  // Sort equities
  const sortCol = state.sort.col;
  const sortFn = (a,b) => {
    let va = sortCol === 'trendScore' ? (a.trendSignals.details?.votes||0) : a[sortCol];
    let vb = sortCol === 'trendScore' ? (b.trendSignals.details?.votes||0) : b[sortCol];
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    if(va==null) va = -Infinity; if(vb==null) vb = -Infinity;
    return state.sort.dir==='asc'?(va>vb?1:-1):(va<vb?1:-1);
  };
  equities.sort(sortFn);

  const arrow = col => state.sort.col===col? `<span style="font-size:9px;margin-left:2px">${state.sort.dir==='asc'?'▲':'▼'}</span>` : '';

  // ── Vote summary panel ──
  const tradeable = state.positions.filter(p=>!isBond(p) && p.trendSignals && p.trendSignals.details);
  const votePs = tradeable.filter(p => p.trendSignals.details.votes != null);
  const v3 = votePs.filter(p=>p.trendSignals.details.votes>=3).length;
  const v2 = votePs.filter(p=>p.trendSignals.details.votes===2).length;

  const signalPanel = `

// ─── TAB: ALLOCATION ─────────────────────
// ═══════════════════════════════════════════════════════════════
//  ALLOCATION — pivot-aware engine
//  Multi-lens decomposition of the portfolio by Region | Sector |
//  Asset Class | Theme. For each bucket the engine computes:
//    - weight       : current MV / total MV
//    - ytdReturn    : geometric link of daily bucket returns over YTD
//    - volAnnual    : annualised standard deviation of bucket daily returns
//    - volContrib   : marginal contribution to portfolio variance,
//                     where Σ_b w_b · cov(r_b, r_p) / σ²_p = 1 by identity.
//  Concentration metrics: HHI, effective N, top-5 weight, diversification
//  ratio (Σ w_b · σ_b) / σ_portfolio.
// ═══════════════════════════════════════════════════════════════
const PIVOT_LABELS = {region:'Region', sector:'Sector', assetClass:'Asset Class', theme:'Theme'};
const SECTOR_COLORS = {
  'Information Technology':'#2563eb', 'Financials':'#047857', 'Industrials':'#b45309',
  'Energy':'#dc2626', 'Materials':'#a16207', 'Real Estate':'#7c3aed',
  'Health Care':'#0891b2', 'Consumer Discretionary':'#be185d',
  'Communication Services':'#6d28d9', 'Consumer Staples':'#0e7490',
  'Utilities':'#65a30d', 'Diversified':'#64748b',
  'Cash':'#94a3b8', 'Fixed Income':'#475569', 'Government':'#475569',
  'Other':'#9ca3af'
};
const ASSET_CLASS_COLORS = {
  'Equity':'#1d4ed8', 'Fixed Income':'#047857', 'Real Estate':'#7c3aed',
  'Commodity':'#b45309', 'Cash':'#64748b', 'Other':'#9ca3af'
};
const REGION_COLORS_FULL = {
  'Singapore':'#047857', 'United States':'#1d4ed8', 'Europe':'#6d28d9',
  'Asia Pacific ex-Japan':'#b91c1c', 'Japan':'#be185d', 'Australia':'#dc2626',
  'Other':'#9ca3af'
};

function _bucketKeyFor(p, pivot) {
  if (pivot === 'region') return REGION_BY_EXCHANGE[p.exchange] || 'Other';
  if (pivot === 'sector') return SECTOR_BY_TICKER[p.ticker] || (p.type === 'Bond' ? 'Fixed Income' : p.type === 'Cash' ? 'Cash' : 'Other');
  if (pivot === 'assetClass') return deriveAssetClass(p);
  if (pivot === 'theme') {
    // Align with Attribution: group by p.theme directly (~30 themes), not by
    // the 6 broad themeCats categories. Colours are mapped back to the parent
    // category via _themeCat() so the chart keeps visual cohesion.
    return p.theme || 'Other';
  }
  return 'Other';
}

// _themeCat helper: map an individual theme string to its parent category
// from themeCats. Used for colour lookup so individual themes inherit the
// category palette (Singapore green, China & Asia red, etc.).
function _themeCat(theme) {
  for (const [cat, themes] of Object.entries(themeCats)) {
    if (themes.includes(theme)) return cat;
  }
  return 'Other';
}

function _bucketColorFor(pivot, key) {
  if (pivot === 'region') return REGION_COLORS_FULL[key] || '#64748b';
  if (pivot === 'sector') return SECTOR_COLORS[key] || '#64748b';
  if (pivot === 'assetClass') return ASSET_CLASS_COLORS[key] || '#64748b';
  if (pivot === 'theme') return themeCatColors[_themeCat(key)] || '#64748b';
  return '#64748b';
}

// Compute bucketed risk + return statistics over the YTD window.
// Vol contribution uses current (today) weights with historical bucket
// daily returns — the canonical "fixed-weights" decomposition.
function calcAllocationRisk(ps, trades, pivot) {
  const startDateStr = '2026-01-01';
  const totalMV = ps.reduce((s, p) => s + (p.mktValueSGD || 0), 0);

  // Group positions by bucket
  const groups = {};
  for (const p of ps) {
    const k = _bucketKeyFor(p, pivot);
    if (!groups[k]) groups[k] = { positions: [], mv: 0 };
    groups[k].positions.push(p);
    groups[k].mv += p.mktValueSGD || 0;
  }

  // Priced subset only — bonds/cash/unpriced have no daily-return history.
  const priced = ps.filter(p => p.history && p.history.length >= 50 && p.type !== 'Bond' && p.type !== 'Cash');

  // Unified date axis from YTD start onward, snapshot-extended with today.
  const allDates = new Set();
  for (const p of priced) {
    for (const bar of p.history) {
      const ds = (bar.date instanceof Date ? bar.date : new Date(bar.date)).toISOString().slice(0,10);
      if (ds >= startDateStr) allDates.add(ds);
    }
  }
  let dates = [...allDates].sort();
  dates = _maybeAppendTodayDate(dates, priced);

  // Adjclose-based closeMatrix with seed-from-last-bar-before-window so
  // staggered market openings do not produce first-day return artifacts.
  // Snapshot-aware: today gets populated from p.mktPrice.
  const closeMatrix = {};
  const todayISO_alloc = new Date().toISOString().slice(0, 10);
  for (const p of priced) {
    closeMatrix[p.ticker] = {};
    let seed = null;
    for (let i = p.history.length - 1; i >= 0; i--) {
      const bar = p.history[i];
      const ds = (bar.date instanceof Date ? bar.date : new Date(bar.date)).toISOString().slice(0,10);
      if (ds < startDateStr) { seed = bar.adjclose != null ? bar.adjclose : bar.close; break; }
    }
    for (const bar of p.history) {
      const ds = (bar.date instanceof Date ? bar.date : new Date(bar.date)).toISOString().slice(0,10);
      closeMatrix[p.ticker][ds] = bar.adjclose != null ? bar.adjclose : bar.close;
    }
    if (dates.length > 0 && dates[dates.length - 1] === todayISO_alloc && p.mktPrice != null) {
      closeMatrix[p.ticker][todayISO_alloc] = p.mktPrice;
    }
    let last = seed;
    for (const ds of dates) {
      if (closeMatrix[p.ticker][ds] != null) last = closeMatrix[p.ticker][ds];
      else if (last != null) closeMatrix[p.ticker][ds] = last;
    }
  }

  // Per-bucket daily value series using CURRENT qty (fixed-weights convention
  // for vol decomposition — current allocation, historical price moves).
  // FX-as-of-date: each bar's value uses the FX rate observed on that date.
  const bucketValueSeries = {};
  for (const [k, g] of Object.entries(groups)) {
    const series = new Array(dates.length).fill(0);
    for (const p of g.positions) {
      if (!closeMatrix[p.ticker]) continue;
      for (let i = 0; i < dates.length; i++) {
        const px = closeMatrix[p.ticker][dates[i]];
        if (px != null) series[i] += p.qty * px * fxAtDate(p.ccy, dates[i]);
      }
    }
    bucketValueSeries[k] = series;
  }

  // Daily returns per bucket
  const bucketReturns = {};
  for (const [k, series] of Object.entries(bucketValueSeries)) {
    const rets = [];
    for (let i = 1; i < series.length; i++) {
      rets.push(series[i-1] > 0 ? (series[i] / series[i-1] - 1) : 0);
    }
    bucketReturns[k] = rets;
  }

  // Portfolio daily return = w_b weighted sum of bucket daily returns
  const N = Math.max(0, dates.length - 1);
  const portRets = new Array(N).fill(0);
  for (const [k, g] of Object.entries(groups)) {
    const w = totalMV > 0 ? g.mv / totalMV : 0;
    const rets = bucketReturns[k];
    for (let i = 0; i < N; i++) portRets[i] += w * rets[i];
  }

  // Stats helpers
  const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
  const variance = (a,m) => { m = m ?? mean(a); return a.length ? a.reduce((s,x)=>s+(x-m)*(x-m),0)/a.length : 0; };
  const covar = (a,b) => {
    const ma = mean(a), mb = mean(b);
    return a.length ? a.reduce((s,x,i)=>s+(x-ma)*(b[i]-mb),0)/a.length : 0;
  };

  const portVar = variance(portRets);
  const portVol = Math.sqrt(portVar);

  // Assemble result buckets
  const result = [];
  for (const [k, g] of Object.entries(groups)) {
    const w = totalMV > 0 ? g.mv / totalMV : 0;
    const rets = bucketReturns[k];
    const vol = Math.sqrt(variance(rets));
    const cv = portVar > 0 ? covar(rets, portRets) : 0;
    const volContribFrac = portVar > 0 ? (w * cv / portVar) : 0;
    let cum = 1;
    for (const r of rets) cum *= (1 + r);
    const ytdReturn = (cum - 1) * 100;
    const volAnnual = vol * Math.sqrt(252) * 100;
    result.push({
      key: k,
      mv: g.mv,
      weight: w * 100,
      ytdReturn,
      volAnnual,
      volContrib: volContribFrac * 100,
      count: g.positions.length,
      color: _bucketColorFor(pivot, k)
    });
  }
  result.sort((a,b) => b.weight - a.weight);

  // Concentration block
  const weightsFrac = result.map(r => r.weight / 100);
  const hhi = weightsFrac.reduce((s,w)=>s+w*w, 0);
  const effectiveN = hhi > 0 ? 1/hhi : 0;
  const top5 = result.slice(0,5).reduce((s,b)=>s+b.weight, 0);
  const wAvgVolFrac = result.reduce((s,b)=>s + (b.weight/100) * (b.volAnnual/100), 0);
  const portVolAnnual = portVol * Math.sqrt(252);
  const divRatio = portVolAnnual > 0 ? wAvgVolFrac / portVolAnnual : 0;

  return {
    totalMV,
    portfolioVol: portVolAnnual * 100,
    buckets: result,
    concentration: { hhi: hhi * 10000, effectiveN, top5, divRatio }
  };
}

function setAllocPivot(p) {
  state.allocPivot = p;
  const pane = document.getElementById('pane-allocation');
  if (pane) renderAllocation(pane);
}

// Sort state for the allocation table. Clicking a column toggles direction
// when re-clicking the same column, otherwise switches to that column with
// a sensible default direction (desc for numeric columns).
function setAllocSort(col) {
  if (!state.allocSort) state.allocSort = { col: 'volContrib', dir: 'desc' };
  if (state.allocSort.col === col) {
    state.allocSort.dir = state.allocSort.dir === 'desc' ? 'asc' : 'desc';
  } else {
    state.allocSort = { col, dir: 'desc' };
  }
  const pane = document.getElementById('pane-allocation');
  if (pane) renderAllocation(pane);
}

function renderAllocation(el) {
  const ps = state.positions;
  if (!state.allocPivot) state.allocPivot = 'theme';
  const pivot = state.allocPivot;
  const out = calcAllocationRisk(ps, TRADES_YTD, pivot);

  // Sort state — default to vol contribution descending so risk centres
  // surface first. Click handlers in the table headers toggle this.
  if (!state.allocSort) state.allocSort = { col: 'volContrib', dir: 'desc' };
  const sortCol = state.allocSort.col;
  const sortDir = state.allocSort.dir;
  out.buckets.sort((a, b) => {
    const va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'string') return sortDir === 'desc' ? vb.localeCompare(va) : va.localeCompare(vb);
    return sortDir === 'desc' ? (vb - va) : (va - vb);
  });

  // Sort-arrow helper for the header cells.
  const sortArrow = c => state.allocSort.col === c
    ? `<span style="color:var(--t1);margin-left:3px">${state.allocSort.dir === 'desc' ? '▼' : '▲'}</span>`
    : '';

  // ─── Risk summary numbers ─────────────────────────────────────
  // Sort a separate copy by vol contribution for the top-3 figure (independent

  const byVol = [...out.buckets].sort((a, b) => b.volContrib - a.volContrib);

// Toggle chart in action alerts
window.toggleActionChart = function(ticker, event) {
  // Prevent clicking inside the chart from re-toggling
  if (event) {
    const tgt = event.target;
    if (tgt.closest && tgt.closest('.action-chart-wrap')) return;
  }
  const safe = ticker.replace(/\./g,'_');
  const placeholder = document.getElementById('action-chart-'+safe);
  const arrow = document.getElementById('action-arrow-'+safe);
  if (!placeholder) { console.error('No placeholder for', ticker); return; }

  // If chart already rendered, toggle off
  if (placeholder.style.display !== 'none' && placeholder.innerHTML.trim()) {
    placeholder.innerHTML = '';
    placeholder.style.display = 'none';
    if (arrow) arrow.style.transform = '';
    return;
  }

  // Show placeholder FIRST so it has dimensions
  placeholder.style.display = 'block';
  placeholder.style.padding = '4px 16px 16px 16px';
  const plotId = 'action-plot-'+safe;
  placeholder.innerHTML = '<div class="action-chart-wrap" onclick="event.stopPropagation()"><div id="'+plotId+'" style="height:380px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);background:#fafaf8"></div></div>';
  if (arrow) arrow.style.transform = 'rotate(90deg)';

  const pos = state.positions.find(p=>p.ticker===ticker);
  if (!pos || !pos.history) {
    document.getElementById(plotId).innerHTML = '<div style="padding:40px;text-align:center;color:var(--t3)">No price data available for '+ticker+'</div>';
    return;
  }
  // Use setTimeout to ensure DOM is painted before Plotly measures
  setTimeout(() => {
    try {
      renderStockChart(plotId, pos);
    } catch(e) {
      console.error('Chart render error for', ticker, e);
      document.getElementById(plotId).innerHTML = '<div style="padding:40px;text-align:center;color:var(--r)">Chart error: '+e.message+'</div>';
    }
  }, 100);
};

let signalExpandedTicker = null;

function renderSignals(el) {
  const ps = [...state.positions].sort((a,b)=>(b.trendSignals.details?.votes||0)-(a.trendSignals.details?.votes||0));
  const livePs = ps.filter(p => p.type !== 'Bond' && p.trendSignals.source === 'live' && (p.trendSignals.details||{}).atr > 0);

  // === CLASSIFY POSITIONS INTO ACTION BUCKETS ===
  const actionItems = [];
  livePs.forEach(p => {
    const ts = p.trendSignals, d = ts.details || {}, px = p.mktPrice;
    const atr = d.atr || 0;
    if (!atr) return;
    const dp = px<10?3:2;

    if (ts.signal === 'SELL') {
      const d2 = ts.details || {};
      actionItems.push({p, priority: 0, type: 'EXIT', color: 'var(--r)', bg: 'var(--r-bg2)',
        headline: 'Monthly vote EXIT — 0/3 signals',
        detail: `${d2.voteA?'✓':'✗'} C>SMA200, ${d2.voteB?'✓':'✗'} Golden Cross, ${d2.voteC?'✓':'✗'} 12M Mom`});
      return;
    }

    // EXIT: 1/3 vote positions — already exited under symmetric 2/3 rule
    if (ts.signal === 'SELL' && d.votes === 1) {
      actionItems.push({p, priority: 1, type: 'EXIT', color: 'var(--r)', bg: 'var(--r-bg2)',
        headline: `Monthly vote EXIT — 1/3 signals`,
        detail: `${d.voteA?'✓':'✗'} C>SMA200, ${d.voteB?'✓':'✗'} Golden Cross, ${d.voteC?'✓':'✗'} 12M Mom · Re-entry at next month-end when votes ≥ 2`});
    }

    const plan = calcTradePlan(px, atr, d.atsStop, d.atsBreached, d.atsFinalDir, d.hh55, ts.signal);
    if (!plan) return;

    // ATR extension: how many ATRs above the active stop?
    const atrAboveStop = atr > 0 ? (px - plan.activeStop) / atr : 0;

    // (B) Monthly vote exit: votes < 2/3 at month-end
    if (d.exitType === 'trend') {
      actionItems.push({p, plan, priority: 1, type: 'TREND EXIT', color: '#b45309', bg: 'var(--a-bg)',
        headline: `Monthly vote EXIT — ${d.votes||0}/3 signals bearish`,
        detail: `Evaluated ${d.lastEvalDate || 'last month-end'}: ${d.voteA?'✓':'✗'} C>SMA200, ${d.voteB?'✓':'✗'} Golden Cross, ${d.voteC?'✓':'✗'} 12M Mom · Votes < 2 → exit`});
    }

    // (C) Overbought trim (one-time ≥8×ATR) or general extension warning (≥4×ATR)
    if (d.trimSignal && !plan.trailBreached) {
      actionItems.push({p, plan, priority: 2, atrExt: atrAboveStop, type: 'TRIM', color: '#7c3aed', bg: 'var(--p-bg)',
        headline: `Overbought trim — ${fmt(atrAboveStop,1)}× ATR extension`,
        detail: `Price ${fmt(px,dp)} is ≥8 ATRs above stop ${fmt(plan.activeStop,dp)} · Consider trimming 33% of position`});
    } else if (atrAboveStop >= 4 && !plan.trailBreached && d.exitType !== 'trend') {
      actionItems.push({p, plan, priority: 2, atrExt: atrAboveStop, type: 'EXTENDED', color: 'var(--p)', bg: 'var(--p-bg)',
        headline: `${fmt(atrAboveStop,1)}× ATR above stop — consider trim`,
        detail: `Price ${fmt(px,dp)} is ${fmt(atrAboveStop,1)} ATRs above trailing stop ${fmt(plan.activeStop,dp)}`});
    }

    // Store plan and extension for the full table
    p._plan = plan;
    p._atrExt = atrAboveStop;
  });

  // Collect positions with no action alerts (NIL)
  const alertTickers = new Set(actionItems.map(a => a.p.ticker));
  const nilPositions = livePs.filter(p => !alertTickers.has(p.ticker) && p.trendSignals && p.trendSignals.signal !== '—');

  actionItems.sort((a,b) => a.priority - b.priority);

  el.innerHTML = `
    ${actionItems.length > 0 ? `
    <div class="mb">
      <div class="card" style="border-left:3px solid var(--r)">
        <div class="card-head">
          <div class="card-title"><span class="indicator" style="background:var(--r)"></span>Action Required — ${actionItems.length} Position${actionItems.length>1?'s':''}</div>
          <div style="font-size:10px;color:var(--t3)">Exits (0/3 votes), cautions (1/3 — needs 2/3 to re-enter), trims (≥8× ATR), extensions (≥4× ATR)</div>
        </div>
        <div class="card-body" style="padding:0">
          <div style="padding:8px 16px;background:var(--b-bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--b)">
            <span style="font-size:14px">📈</span>
            <span><strong>Tap any row</strong> to expand interactive price chart with SMA200, trend signals &amp; vote breakdown</span>
          </div>
          ${actionItems.map((a,ai) => {
            const ts = a.p.trendSignals;
            const d = ts.details || {};
            const sigC = sigCls(ts.signal);
            const safe = a.p.ticker.replace(/\./g,'_');
            const chartId = 'action-chart-'+safe;
            const rowId = 'action-row-'+safe;

            // Build reasoning based on alert type
            let reasoning = '';
            if (a.type === 'EXIT') {

              reasoning = `<div style="margin-top:8px;padding:10px 12px;background:rgba(255,255,255,0.7);border-radius:6px;font-size:10px;line-height:1.6">
                <div style="font-weight:600;margin-bottom:4px;color:var(--t1)">Why EXIT?</div>
                <div style="color:var(--t2)">
                  <strong>Monthly vote: ${d.votes||0}/3</strong> — majority lost at month-end<br>
                  ${d.voteA ? '<span style="color:var(--g)">✓</span>' : '<span style="color:var(--r)">✗</span>'} Close ${d.voteA?'above':'below'} SMA200<br>
                  ${d.voteB ? '<span style="color:var(--g)">✓</span>' : '<span style="color:var(--r)">✗</span>'} ${d.voteB?'Golden':'Death'} Cross (SMA50 vs SMA200)<br>
                  ${d.voteC ? '<span style="color:var(--g)">✓</span>' : '<span style="color:var(--r)">✗</span>'} 12-month momentum: ${d.mom12m!=null?(d.mom12m>=0?'+':'')+d.mom12m.toFixed(1)+'%':'N/A'}

// ═══════════════════════════════════════════════════════════════
//  BACKTEST: CRISIS RISK OVERLAY (Triple Filter)
//  Buy-and-hold by default. Reduces to 25% during systemic stress.
//  Entry: ALL of >60% <SMA200 + 3M ret<-10% + >50% bearish ST
//  Exit: ANY of <40% <SMA200 or 1M ret>+5% or >50% bullish ST
// ═══════════════════════════════════════════════════════════════
function runBacktest(positions) {
  const chartEl = document.getElementById('backtestChart');
  const statsEl = document.getElementById('backtestStats');
  if (!chartEl || !statsEl) return;

  const TC = 0.0020;
  const eligible = positions.filter(p => p.type !== 'Bond' && p.history && p.history.length >= 80);
  if (eligible.length < 3) {
    statsEl.innerHTML = '<div style="font-size:11px;color:var(--t3);padding:12px">Need ≥3 equity positions with data</div>';
    return;
  }
  const N = eligible.length;
  const stockCloses = eligible.map(p => p.history.map(h => h.close));

  const stockSMA200 = eligible.map((p, j) => {
    const cls = stockCloses[j], L = cls.length;
    const sma = new Float64Array(L);
    let sum = 0;
    for (let i = 0; i < L; i++) {
      sum += cls[i];
      if (i >= 200) sum -= cls[i-200];
      if (i >= 199) sma[i] = sum / 200;
    }
    return sma;
  });

  const stockSTDir = eligible.map((p, j) => {
    const hist = p.history, L = hist.length;
    const dir = new Int8Array(L);
    if (L < 15) return dir;
    const P=10, M=3;
    let atr=0;
    for(let i=1;i<=P;i++) atr+=Math.max(hist[i].high-hist[i].low,Math.abs(hist[i].high-hist[i-1].close),Math.abs(hist[i].low-hist[i-1].close));
    atr/=P;
    let ub=(hist[P].high+hist[P].low)/2+M*atr, lb=(hist[P].high+hist[P].low)/2-M*atr;
    let tr=hist[P].close>(hist[P].high+hist[P].low)/2?1:-1;
    dir[P]=tr;
    for(let i=P+1;i<L;i++){
      const ttr=Math.max(hist[i].high-hist[i].low,Math.abs(hist[i].high-hist[i-1].close),Math.abs(hist[i].low-hist[i-1].close));
      atr=(atr*(P-1)+ttr)/P;
      const hl2=(hist[i].high+hist[i].low)/2;
      const nUb=hl2+M*atr,nLb=hl2-M*atr;
      ub=(nUb<ub||hist[i-1].close>ub)?nUb:ub;
      lb=(nLb>lb||hist[i-1].close<lb)?nLb:lb;
      if(hist[i].close>ub)tr=1;else if(hist[i].close<lb)tr=-1;
      dir[i]=tr;
    }
    return dir;
  });

  // Pre-compute SMA50 for monthly vote strategy
  const stockSMA50 = eligible.map((p, j) => {
    const cls = stockCloses[j], L = cls.length;
    const sma = new Float64Array(L);
    let sum = 0;
    for (let i = 0; i < L; i++) {
      sum += cls[i]; if (i >= 50) sum -= cls[i-50]; if (i >= 49) sma[i] = sum / 50;
    }
    return sma;
  });

  // Per-stock monthly vote state (for the "Exit 2/3, Enter 2/3" strategy)
  // Start ALL stocks as IN — we already hold them. First month-end evaluation
  // will exit any that fail the vote. This matches real portfolio behavior.
  const stockVoteIn = new Array(N).fill(true);
  // Track votes per stock for display
  let stockVoteTrades = 0;

  const allDatesSet = new Set();
  eligible.forEach(p => p.history.forEach(h => {
    allDatesSet.add(h.date instanceof Date ? h.date.toISOString().slice(0,10) : String(h.date));
  }));
  const allDatesSorted = [...allDatesSet].sort();
  const stockByDate = eligible.map(p => {
    const map = new Map();
    p.history.forEach((h,i) => {
      map.set(h.date instanceof Date ? h.date.toISOString().slice(0,10) : String(h.date), i);
    });
    return map;
  });

  const WARMUP = 50;
  const dates=[], bhReturns=[], overlayReturns=[], voteReturns=[], combReturns=[];
  const regimeHistory=[];
  let totalTrades=0, crisisEvents=0;
  let regime='NORMAL';
  const portRetWindow=[];

  // Track live crisis indicators for KPI display
  let lastBreadth=0, lastRet3m=0, lastStBear=0;
  let prevDateStr = '';

  for (const dateStr of allDatesSorted) {
    let bhSum=0, activeN=0;
    const stockData=[];

    // Detect month-end (date month changes vs next date)
    const curMonth = dateStr.slice(0,7); // YYYY-MM
    const prevMonth = prevDateStr.slice(0,7);
    const isNewMonth = prevDateStr && curMonth !== prevMonth; // today is first day of new month = previous was month-end

    for (let j=0;j<N;j++) {
      const idx=stockByDate[j].get(dateStr);
      if(idx==null||idx<WARMUP) continue;
      const hist=eligible[j].history;
      const dailyRet=hist[idx].close/hist[idx-1].close-1;
      activeN++;
      bhSum+=dailyRet;
      stockData.push({j,idx,dailyRet});
    }
    if(activeN<3) { prevDateStr = dateStr; continue; }
    const bhDayRet=bhSum/activeN;

    // Monthly vote strategy: evaluate at month-end (= when we detect a new month)
    let voteTCtoday = 0;
    if (isNewMonth) {
      for (const sd of stockData) {
        const j = sd.j, idx = sd.idx;
        const cls = stockCloses[j];
        // Use previous bar's indicators (end of last month)
        const prevIdx = idx - 1;
        // Only need SMA200 ready (prevIdx >= 199) — don't require 252
        if (prevIdx < 199) continue;
        const s200 = stockSMA200[j][prevIdx];
        const s50 = stockSMA50[j][prevIdx];

        // 12M calendar momentum: use best available lookback
        let mom12 = null;
        if (prevIdx >= 252) {
          mom12 = (cls[prevIdx] / cls[prevIdx - 252]) - 1;
        } else if (prevIdx >= 200) {
          // Use available lookback as proxy (shorter momentum)
          mom12 = (cls[prevIdx] / cls[prevIdx - 200]) - 1;
        }

        // Count votes (2 always available once SMA200 ready, 3rd when momentum ready)
        let v = 0, maxVotes = 2;
        if (s200 > 0 && cls[prevIdx] > s200) v++;
        if (s50 > 0 && s200 > 0 && s50 > s200) v++;
        if (mom12 != null) {
          maxVotes = 3;
          if (mom12 > 0) v++;
        }

        // Symmetric: exit <2, re-enter >=2 (prevents oscillation at votes=1)
        const exitThresh = maxVotes === 3 ? 2 : 2;
        const prevIn = stockVoteIn[j];
        if (stockVoteIn[j] && v < exitThresh) stockVoteIn[j] = false;
        else if (!stockVoteIn[j] && v >= 2) stockVoteIn[j] = true;
        if (prevIn !== stockVoteIn[j]) { stockVoteTrades++; voteTCtoday += TC; }
      }
    }

    // Compute monthly vote portfolio return (equal-weighted, per-stock in/out)
    let voteSum = 0, voteActive = 0;
    for (const sd of stockData) {
      voteActive++;
      if (stockVoteIn[sd.j]) {
        voteSum += sd.dailyRet;
      }
    }
    const voteDayRet = voteActive > 0 ? voteSum / voteActive - voteTCtoday / Math.max(voteActive, 1) : 0;

    portRetWindow.push(bhDayRet);
    if(portRetWindow.length>63) portRetWindow.shift();
    const ret3m=portRetWindow.length>=20?portRetWindow.reduce((c,r)=>c*(1+r),1)-1:0;
    const ret1m=portRetWindow.length>=20?portRetWindow.slice(-20).reduce((c,r)=>c*(1+r),1)-1:0;

    let belowSMA200=0,totalWithSMA=0,bearishST=0,bullishST=0,stTotal=0;
    for(const sd of stockData){
      const sma=stockSMA200[sd.j][sd.idx-1];
      if(sma>0){totalWithSMA++;if(stockCloses[sd.j][sd.idx-1]<sma)belowSMA200++;}
      stTotal++;
      if(stockSTDir[sd.j][sd.idx-1]===-1)bearishST++;
      if(stockSTDir[sd.j][sd.idx-1]===1)bullishST++;
    }
    const breadth=totalWithSMA>0?belowSMA200/totalWithSMA:0;
    const stBear=stTotal>0?bearishST/stTotal:0;
    const stBull=stTotal>0?bullishST/stTotal:0;

    lastBreadth=breadth; lastRet3m=ret3m; lastStBear=stBear;

    const prevRegime=regime;
    if(regime==='NORMAL'){
      if(breadth>0.60&&ret3m<-0.10&&stBear>0.50){regime='CRISIS';crisisEvents++;totalTrades+=2;}
    } else {
      if(breadth<0.40||ret1m>0.05||stBull>0.50) regime='NORMAL';
    }
    let dayRet=bhDayRet;
    if(regime==='CRISIS') dayRet=bhDayRet*0.25+0.00016*0.75;
    if(prevRegime!==regime) dayRet-=TC;

    // Combined: Monthly Vote stock selection + Crisis Overlay macro hedge
    let combDayRet = voteDayRet;
    if(regime==='CRISIS') combDayRet = voteDayRet*0.25+0.00016*0.75;
    if(prevRegime!==regime) combDayRet -= TC;

    dates.push(dateStr);
    bhReturns.push(bhDayRet);
    overlayReturns.push(dayRet);
    voteReturns.push(voteDayRet);
    combReturns.push(combDayRet);
    regimeHistory.push(regime);
    prevDateStr = dateStr;
  }

  if(dates.length<20){statsEl.innerHTML='<div>Insufficient data</div>';return;}

  // Store latest crisis indicators on state for KPI display
  window._crisisIndicators = {
    regime, breadth: lastBreadth, ret3m: lastRet3m, stBear: lastStBear,
    crisisEvents, crisisDays: regimeHistory.filter(r=>r==='CRISIS').length,
    totalDays: dates.length
  };

  let cumB=100, cumO=100, cumV=100, cumC=100;
  const cB=[100], cO=[100], cV=[100], cC=[100];
  for(let i=0;i<dates.length;i++){
    cumB*=(1+bhReturns[i]);cumO*=(1+overlayReturns[i]);cumV*=(1+voteReturns[i]);cumC*=(1+combReturns[i]);
    cB.push(cumB);cO.push(cumO);cV.push(cumV);cC.push(cumC);
  }
  const plotDates=[dates[0],...dates];

  const d0=new Date(dates[0]),d1=new Date(dates[dates.length-1]);
  const years=Math.max((d1-d0)/(365.25*86400000),0.5);
  const totB=cumB-100, totO=cumO-100, totV=cumV-100, totC=cumC-100;
  const annB=(Math.pow(cumB/100,1/years)-1)*100;
  const annO=(Math.pow(cumO/100,1/years)-1)*100;
  const annV=(Math.pow(cumV/100,1/years)-1)*100;
  const annC=(Math.pow(cumC/100,1/years)-1)*100;
  const meanB=bhReturns.reduce((a,b)=>a+b,0)/bhReturns.length;
  const meanO=overlayReturns.reduce((a,b)=>a+b,0)/overlayReturns.length;
  const meanV=voteReturns.reduce((a,b)=>a+b,0)/voteReturns.length;
  const meanC=combReturns.reduce((a,b)=>a+b,0)/combReturns.length;
  const bVol=Math.sqrt(bhReturns.reduce((s,r)=>s+(r-meanB)**2,0)/(bhReturns.length-1))*Math.sqrt(252)*100;
  const oVol=Math.sqrt(overlayReturns.reduce((s,r)=>s+(r-meanO)**2,0)/(overlayReturns.length-1))*Math.sqrt(252)*100;
  const vVol=Math.sqrt(voteReturns.reduce((s,r)=>s+(r-meanV)**2,0)/(voteReturns.length-1))*Math.sqrt(252)*100;
  const cVol=Math.sqrt(combReturns.reduce((s,r)=>s+(r-meanC)**2,0)/(combReturns.length-1))*Math.sqrt(252)*100;
  const maxDD=(cum)=>{let pk=cum[0],dd=0;for(const v of cum){if(v>pk)pk=v;dd=Math.min(dd,(v-pk)/pk*100);}return dd;};
  const bDD=maxDD(cB), oDD=maxDD(cO), vDD=maxDD(cV), cDD=maxDD(cC);
  const sharpeO=oVol>0?(annO-4)/oVol:0;
  const sharpeB=bVol>0?(annB-4)/bVol:0;
  const sharpeV=vVol>0?(annV-4)/vVol:0;
  const sharpeC=cVol>0?(annC-4)/cVol:0;

  const crisisDays=regimeHistory.filter(r=>r==='CRISIS').length;
  const crisisPct=(crisisDays/dates.length*100).toFixed(0);

  const shapes=[];
  let inCr=false,crS='';
  for(let i=0;i<regimeHistory.length;i++){
    if(regimeHistory[i]==='CRISIS'&&!inCr){inCr=true;crS=dates[i];}
    else if(regimeHistory[i]!=='CRISIS'&&inCr){inCr=false;shapes.push({type:'rect',xref:'x',yref:'paper',x0:crS,x1:dates[i],y0:0,y1:1,fillcolor:'rgba(220,38,38,0.08)',line:{width:0}});}
  }
  if(inCr) shapes.push({type:'rect',xref:'x',yref:'paper',x0:crS,x1:dates[dates.length-1],y0:0,y1:1,fillcolor:'rgba(220,38,38,0.08)',line:{width:0}});

  const bI=cB.map(v=>+v.toFixed(1));
  const oI=cO.map(v=>+v.toFixed(1));
  const vI=cV.map(v=>+v.toFixed(1));
  const cI=cC.map(v=>+v.toFixed(1));

  Plotly.newPlot(chartEl,[
    {x:plotDates,y:cI,type:'scatter',mode:'lines',name:'Combined (Vote + Crisis)',
      line:{color:'#7c3aed',width:3},hovertemplate:'Combined: $%{y:,.0f}<extra></extra>'},
    {x:plotDates,y:oI,type:'scatter',mode:'lines',name:'Crisis Overlay Only',
      line:{color:'#047857',width:1.5,dash:'dot'},hovertemplate:'Overlay: $%{y:,.0f}<extra></extra>'},
    {x:plotDates,y:vI,type:'scatter',mode:'lines',name:'Monthly Vote Only',
      line:{color:'#2563eb',width:1.5,dash:'dot'},hovertemplate:'Vote: $%{y:,.0f}<extra></extra>'},
    {x:plotDates,y:bI,type:'scatter',mode:'lines',name:'Buy & Hold',
      line:{color:'#6b7280',width:1.5,dash:'dash'},hovertemplate:'B&H: $%{y:,.0f}<extra></extra>'},
  ],{
    margin:{t:10,b:32,l:55,r:20},
    paper_bgcolor:'transparent',plot_bgcolor:'#fafaf8',
    font:{family:'DM Sans',size:10,color:'#5c5c56'},
    xaxis:{tickfont:{size:9},tickformat:"%b '%y",nticks:12},
    yaxis:{title:'Growth of $100 (log)',titlefont:{size:10},type:'log',gridcolor:'#f0f0ea',tickfont:{size:9,family:'DM Mono'},zerolinecolor:'#d5d3ca',hoverformat:',.0f'},
    legend:{x:0,y:1.1,orientation:'h',font:{size:10}},
    hovermode:'x unified',
    hoverlabel:{font:{family:'DM Mono',size:10}},
    shapes:shapes,
  },{displayModeBar:false,responsive:true});

  statsEl.innerHTML=`
    <div style="display:flex;gap:0;font-size:11px;font-family:var(--mono)">
      <div style="flex:1.2;padding:8px 12px;border-right:1px solid var(--bd);background:rgba(124,58,237,0.04)">
        <div style="font-family:var(--sans);color:#7c3aed;font-size:9px;margin-bottom:3px;font-weight:700">COMBINED (VOTE + CRISIS)</div>
        <div style="font-size:16px;font-weight:700;color:${totC>=0?'#7c3aed':'var(--r)'}">${totC>=0?'+':''}${totC.toFixed(1)}%</div>
        <div style="font-size:9px;color:var(--t4)">${annC.toFixed(1)}% ann · Sharpe ${sharpeC.toFixed(2)} · DD ${cDD.toFixed(1)}%</div>
      </div>
      <div style="flex:1;padding:8px 12px;border-right:1px solid var(--bd)">
        <div style="font-family:var(--sans);color:var(--t4);font-size:9px;margin-bottom:3px">CRISIS ONLY</div>
        <div style="font-size:14px;font-weight:700;color:${totO>=0?'var(--g)':'var(--r)'}">${totO>=0?'+':''}${totO.toFixed(1)}%</div>
        <div style="font-size:9px;color:var(--t4)">${annO.toFixed(1)}% ann · Sharpe ${sharpeO.toFixed(2)} · DD ${oDD.toFixed(1)}%</div>
      </div>
      <div style="flex:1;padding:8px 12px;border-right:1px solid var(--bd)">
        <div style="font-family:var(--sans);color:var(--t4);font-size:9px;margin-bottom:3px">VOTE ONLY</div>
        <div style="font-size:14px;font-weight:700;color:${totV>=0?'#2563eb':'var(--r)'}">${totV>=0?'+':''}${totV.toFixed(1)}%</div>
        <div style="font-size:9px;color:var(--t4)">${annV.toFixed(1)}% ann · Sharpe ${sharpeV.toFixed(2)} · DD ${vDD.toFixed(1)}% · ${stockVoteTrades} trades</div>
      </div>
      <div style="flex:1;padding:8px 12px;border-right:1px solid var(--bd)">
        <div style="font-family:var(--sans);color:var(--t4);font-size:9px;margin-bottom:3px">BUY & HOLD</div>
        <div style="font-size:14px;font-weight:700;color:${totB>=0?'var(--g)':'var(--r)'}">${totB>=0?'+':''}${totB.toFixed(1)}%</div>
        <div style="font-size:9px;color:var(--t4)">${annB.toFixed(1)}% ann · Sharpe ${sharpeB.toFixed(2)} · DD ${bDD.toFixed(1)}%</div>
      </div>
      <div style="flex:0.8;padding:8px 12px;border-right:1px solid var(--bd)">

        <div style="font-size:14px;font-weight:600">${cVol.toFixed(1)}%</div>
        <div style="font-size:9px;color:var(--t4)">Vote ${vVol.toFixed(1)}% · B&H ${bVol.toFixed(1)}%</div>
      </div>
      <div style="flex:0.7;padding:8px 12px">

        <div style="font-size:9px;color:var(--t4)">${crisisPct}% · ${crisisDays}d</div>

      <span style="color:#7c3aed;font-weight:600">Combined</span>: per-stock vote selection + crisis macro hedge ·
      <span style="color:#047857">Crisis Overlay</span>: 25% exposure during systemic stress ·
      <span style="color:#2563eb">Monthly Vote</span>: exit &lt;2/3, enter ≥2/3 ·
      <span style="color:var(--r)">Red = crisis</span>
    </div>
  `;

  // Update KPI crisis status after backtest completes
  updateCrisisKPI();
}

// Live crisis status KPI (called after backtest computes indicators)
function updateCrisisKPI() {
  const ci = window._crisisIndicators;
  if (!ci) return;
  const el = document.getElementById('crisisKPI');
  if (!el) return;
  const breadthPct = ci.breadth * 100;
  const ret3mPct = ci.ret3m * 100;
  const stBearPct = ci.stBear * 100;

  let metCount = 0;
  if (ci.breadth > 0.60) metCount++;
  if (ci.ret3m < -0.10) metCount++;
  if (ci.stBear > 0.50) metCount++;

  // Count indicators in amber zone (≥75% of threshold but not yet breached)
  let amberCount = 0;
  if (ci.breadth <= 0.60 && ci.breadth > 0.45) amberCount++; // 75% of 60%
  if (ci.ret3m >= -0.10 && ci.ret3m < -0.075) amberCount++; // 75% of -10%
  if (ci.stBear <= 0.50 && ci.stBear > 0.375) amberCount++; // 75% of 50%

  // Status: CRISIS (3/3) > WARNING (2/3) > WATCH (1/3) > ELEVATED (0 met but amber) > ALL CLEAR
  const statusColor = metCount >= 3 ? '#7f1d1d' : metCount === 2 ? '#dc2626' : metCount === 1 ? '#b45309' : amberCount > 0 ? '#92400e' : 'var(--g)';
  const statusLabel = metCount >= 3 ? 'CRISIS' : metCount === 2 ? 'WARNING' : metCount === 1 ? 'WATCH' : amberCount > 0 ? 'ELEVATED' : 'ALL CLEAR';
  const statusBg = metCount >= 3 ? 'var(--r-bg)' : metCount >= 1 ? 'var(--a-bg)' : amberCount > 0 ? 'rgba(251,191,36,0.08)' : 'var(--g-bg)';
  const statusSub = metCount >= 3 ? `${metCount}/3 triggers met — exposure reduced to 25%`
    : metCount > 0 ? `${metCount}/3 triggers met`
    : amberCount > 0 ? `0/3 triggers met · ${amberCount} approaching threshold`
    : '0/3 triggers met';

  // SVG semicircle speed dial
  // value: 0-1 (position on arc), thresh: 0-1 (threshold position), met: bool
  const dial = (label, displayVal, threshLabel, value01, thresh01, met) => {
    const cx = 70, cy = 60, r = 48;
    // Arc from 180° (left) to 0° (right) — semicircle
    const valAngle = Math.PI * (1 - Math.max(0, Math.min(1, value01)));
    const thrAngle = Math.PI * (1 - Math.max(0, Math.min(1, thresh01)));

    // Needle endpoint
    const nx = cx + r * 0.85 * Math.cos(valAngle);
    const ny = cy - r * 0.85 * Math.sin(valAngle);
    // Threshold tick endpoints
    const tx1 = cx + (r - 4) * Math.cos(thrAngle);
    const ty1 = cy - (r - 4) * Math.sin(thrAngle);
    const tx2 = cx + (r + 6) * Math.cos(thrAngle);
    const ty2 = cy - (r + 6) * Math.sin(thrAngle);
    // Threshold label position
    const tlx = cx + (r + 16) * Math.cos(thrAngle);
    const tly = cy - (r + 16) * Math.sin(thrAngle);

    // Arc path helper
    const arcPath = (startFrac, endFrac) => {
      const a1 = Math.PI * (1 - startFrac), a2 = Math.PI * (1 - endFrac);
      const x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
      const x2 = cx + r * Math.cos(a2), y2 = cy - r * Math.sin(a2);
      return `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`;
    };

    const valColor = met ? '#dc2626' : value01 > thresh01 * 0.75 ? '#b45309' : '#047857';

    return `<div style="text-align:center;flex:1">
      <svg viewBox="0 0 140 78" style="width:100%;max-width:160px">
        <!-- Background arc -->
        <path d="${arcPath(0, 1)}" fill="none" stroke="#e8e6df" stroke-width="10" stroke-linecap="round"/>
        <!-- Green zone: 0 to threshold -->
        <path d="${arcPath(0, Math.min(thresh01 * 0.75, thresh01))}" fill="none" stroke="#bbf7d0" stroke-width="10" stroke-linecap="round"/>
        <!-- Amber zone: near threshold -->
        <path d="${arcPath(thresh01 * 0.75, thresh01)}" fill="none" stroke="#fde68a" stroke-width="10" stroke-linecap="round"/>
        <!-- Red zone: beyond threshold -->
        <path d="${arcPath(thresh01, 1)}" fill="none" stroke="#fecaca" stroke-width="10" stroke-linecap="round"/>
        <!-- Threshold tick -->
        <line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
        <text x="${tlx}" y="${tly}" text-anchor="middle" font-size="7" fill="#dc2626" font-family="var(--mono)" font-weight="600">${threshLabel}</text>
        <!-- Needle -->
        <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${valColor}" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="4" fill="${valColor}"/>
        <!-- Value text -->
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="12" font-weight="700" fill="${valColor}" font-family="var(--mono)">${displayVal}</text>
      </svg>
      <div style="font-size:10px;color:var(--t2);margin-top:-2px">
        <span style="color:${met?'var(--r)':'var(--g)'};font-weight:700">${met?'✗':'✓'}</span> ${label}
      </div>
    </div>`;
  };

  // Map each metric to 0-1 scale
  // Breadth: 0-100% where 60% = threshold → thresh01 = 0.60
  const breadthVal = breadthPct / 100;
  // 3M Return: +20% (safe) to -15% (worst) → map to 0-1 where -10% = threshold
  const ret3mVal = Math.max(0, Math.min(1, (20 - ret3mPct) / 35)); // 0 = +20%, 1 = -15%
  const ret3mThresh = (20 + 10) / 35; // -10% maps to ~0.857
  // Supertrend: 0-100% where 50% = threshold → thresh01 = 0.50
  const stBearVal = stBearPct / 100;

  el.innerHTML = `
    <div class="card" style="border-left:3px solid ${statusColor}">
      <div class="card-body" style="padding:12px 20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <div>
            <div style="font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:0.8px">Crisis Overlay Status</div>
            <div style="font-size:18px;font-weight:700;color:${statusColor}">${statusLabel} <span style="font-size:11px;font-weight:500;color:var(--t3)">${statusSub}</span></div>
          </div>
          <span style="padding:4px 12px;border-radius:12px;font-size:10px;font-weight:600;background:${statusBg};color:${statusColor}">${ci.regime}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--bd);padding-top:8px">
          ${dial('Breadth < SMA200', breadthPct.toFixed(0)+'%', '60%', breadthVal, 0.60, ci.breadth > 0.60)}
          ${dial('3M Return', (ret3mPct >= 0 ? '+' : '') + ret3mPct.toFixed(1)+'%', '−10%', ret3mVal, ret3mThresh, ci.ret3m < -0.10)}
          ${dial('Bear Supertrend', stBearPct.toFixed(0)+'%', '50%', stBearVal, 0.50, ci.stBear > 0.50)}
        </div>
        <div style="font-size:9px;color:var(--t4);margin-top:4px;border-top:1px solid var(--bd);padding-top:6px">
          Crisis triggers when ALL 3 conditions met simultaneously · Recovery: ANY of &lt;40% breadth, 1M &gt;+5%, or &gt;50% bullish ST ·
          <span style="color:var(--r)">${ci.crisisEvents} events</span> · ${ci.crisisDays}d in crisis (${(ci.crisisDays/ci.totalDays*100).toFixed(0)}%)
        </div>
      </div>
    </div>
  `;
}

      <div class="card">
